:610px;margin:0;color:#e7fff7;font-size:clamp(16px,2vw,21px);line-height:1.65}.points{display:flex;flex-wrap:wrap;gap:9px;max-width:650px;margin-top:22px}.point{width:190px;padding:14px;border:1px solid #ffffff34;border-radius:18px;background:#ffffff13;backdrop-filter:blur(11px);animation:up .55s ease both}.point:nth-child(2){animation-delay:.2s}.point:nth-child(3){animation-delay:.4s}.point b,.point span{display:block}.point span{margin-top:4px;color:#d4f5eb;font-size:11px;line-height:1.45}.links{display:flex;flex-wrap:wrap;gap:9px;margin-top:23px}.links a{min-height:50px;padding:12px 17px;border-radius:14px;display:grid;place-items:center;text-decoration:none;background:var(--mint);color:#063c32;font-weight:950}.links .soft{background:#ffffff16;color:#fff;border:1px solid #ffffff38}.notice{position:absolute;z-index:8;right:13px;top:74px;max-width:340px;padding:9px 11px;border-radius:11px;background:#58420bd9;border:1px solid #edd06c;color:#fff0ba;font-size:10px;line-height:1.5}.caption{position:fixed;z-index:20;left:50%;bottom:120px;transform:translateX(-50%);width:min(calc(100% - 34px),760px);padding:10px 13px;border-radius:12px;background:#001b17c9;text-align:center;font-size:13px;line-height:1.45}.controls{position:fixed;z-index:22;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(calc(100% - 28px),820px);padding:11px;border:1px solid #ffffff30;border-radius:20px;background:#032a24e9;backdrop-filter:blur(15px)}.bar{height:5px;border-radius:99px;overflow:hidden;background:#ffffff28}.fill{height:100%;width:0;background:linear-gradient(90deg,var(--mint),var(--lime))}.row{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto auto;gap:8px;align-items:center;margin-top:9px}.row button{height:44px;border:0;border-radius:13px;padding:0 14px;background:#ffffff17;color:#fff;font-weight:950}.row .play{background:var(--mint);color:#073c32}.count{text-align:center;color:#d5f3ea;font-size:12px}.stage.flash .content{animation:flash .45s ease}.stage.flash .product{animation:flashProduct .5s ease}@keyframes float{50%{transform:translateY(calc(-50% - 13px)) rotate(1deg)}}@keyframes spin{to{transform:translateY(-50%) rotate(1turn)}}@keyframes up{from{opacity:0;transform:translateY(15px)}}@keyframes flash{from{opacity:.3;transform:translateY(8px)}}@keyframes flashProduct{from{opacity:.2;transform:translateY(-50%) scale(.92)}}@media(max-width:740px){body{overflow:auto}.presenter{object-position:70% center}.product{width:155px;right:9px;top:29%}.rings{width:320px;height:320px;right:-90px;top:30%}.content{align-content:end;padding:105px 18px 210px}.content h1{font-size:clamp(33px,10vw,51px);letter-spacing:-1px}.lead{font-size:14px}.points{display:grid;grid-template-columns:1fr 1fr;gap:7px}.point{width:auto;padding:11px}.notice{top:72px;right:8px;max-width:245px}.caption{bottom:135px;font-size:11px}.row{grid-template-columns:auto auto minmax(0,1fr) auto}.row .voice{grid-column:1/-1}}

<body>
  <header class="top"><a href="melaleuca-product-video.html" aria-label="제품 영상">←</a><div class="brand"><b>리뉴 스킨 테라피 · 웹 영상</b><small>독특성 · 확인사항 · 본사 공식몰 연결</small></div><button onclick="window.__SARANGBANG_LISTEN__?.()">◉</button></header>
  <main class="stage" id="stage"><div class="rings"></div><img class="presenter" id="presenter" src="assets/overview-presenter-2.webp" alt="리뉴 제품을 안내하는 한국인 모델"><img class="product" src="melaleuca-renew.png" alt="리뉴 인텐시브 스킨 테라피 제품"><div class="notice">화장품 일반 안내입니다. 질병 치료·예방을 의미하지 않습니다. 제품 사진·설명의 권리는 권리자에게 있으며 공식몰의 최신 표시가 우선합니다.</div><section class="content"><span class="eyebrow" id="eyebrow"></span><h1 id="title"></h1><p class="lead" id="lead"></p><div class="points" id="points"></div><div class="links"><a id="buy" href="https://kr.melaleuca.com/productstore/medicines-and-treatments" target="_blank" rel="noopener">멜라루카 코리아 공식몰</a><a class="soft" href="melaleuca-ai.html">제품 문의</a></div></section><p class="caption" id="caption"></p></main>
  <div class="controls"><div class="bar"><div class="fill" id="fill"></div></div><div class="row"><button id="prev">‹</button><button class="play" id="play">일시정지</button><div class="count" id="count"></div><button id="next">›</button><button class="voice" id="voice">🔊 음성 해설</button></div></div>
  <script>
    (()=>{const scenes=[
      {eye:'RENEW · SCENE 1',title:'건조한 피부를 위한<br>스킨 테라피',lead:'리뉴 인텐시브 스킨 테라피를 제품 특징·사용 확인·공식 구매 순서로 살펴봅니다.',points:[['건조 피부 케어','피부 보습을 위한 화장품'],['일상 루틴','필요한 부위에 라벨대로'],['공식 확인','최신 표시와 주의사항']],speech:'건조한 피부를 위한 리뉴 인텐시브 스킨 테라피를 소개합니다. 이 영상은 제품 특징과 사용 전 확인사항을 안내하고 멜라루카 코리아 공식몰 구매 화면으로 연결합니다.',img:'assets/overview-presenter-2.webp'},
      {eye:'RENEW · SCENE 2',title:'리뉴의 독특성은<br>지속형 피부 케어',lead:'공식 페이지는 건조한 피부를 위한 제품이며, 인체적용시험으로 확인된 피부 진정 효과와 오래 지속되도록 설계된 점을 안내합니다.',points:[['인체적용시험','공식 표시 범위에서 확인'],['피부 진정','화장품 사용에 따른 효과'],['지속성 설계','오래 지속되도록 만든 포뮬러']],speech:'리뉴의 독특성은 건조한 피부를 위한 지속형 스킨 테라피라는 점입니다. 공식 페이지는 인체적용시험으로 확인된 피부 진정 효과와 오래 지속되도록 만든 제품이라고 안내합니다. 개인의 피부 상태에 따라 사용감은 다를 수 있습니다.',img:'assets/overview-presenter-1.webp'},
      {eye:'RENEW · SCENE 3',title:'사용 전에는<br>라벨을 먼저',lead:'사용 부위·횟수·주의사항과 전성분을 확인하고, 민감한 피부는 좁은 부위에 먼저 시험합니다.',points:[['전성분 확인','알레르기·민감 성분 점검'],['소량 시험','좁은 부위부터 확인'],['이상 반응','사용 중지 후 전문가 문의']],speech:'사용 전 제품 라벨의 전성분, 사용 부위, 횟수와 주의사항을 확인하세요. 민감한 피부는 좁은 부위에 먼저 시험하고 이상 반응이 있으면 사용을 중지하고 전문가에게 문의하세요.',img:'assets/overview-presenter-3.webp'},
      {eye:'RENEW · SCENE 4',title:'구매는 본사 공식몰에서<br>고객이 직접',lead:'사랑방은 제품을 결제·배송하지 않습니다. 고객이 멜라루카 코리아 공식몰에서 가격·재고·회원조건을 확인하고 직접 구매하도록 연결합니다.',points:[['공식몰 이동','회사 판매 화면으로 연결'],['본인 확인','가격·재고·회원 조건'],['회사 처리','결제·배송·교환·반품']],speech:'구매는 고객이 멜라루카 코리아 공식몰에서 직접 진행합니다. 사랑방은 구매 화면 연결과 사용 전 확인을 도울 뿐 결제나 배송을 대신하지 않습니다. 가격, 재고, 회원 조건, 교환과 반품은 공식몰에서 최종 확인하세요.',img:'assets/overview-presenter-2.webp'}
    ];const el=id=>document.getElementById(id),stage=el('stage'),fill=el('fill'),play=el('play');let i=0,playing=true,voiceOn=false,start=performance.now(),elapsed=0;const duration=10500;
      function speak(){if(!voiceOn)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(scenes[i].speech);u.lang='ko-KR';u.rate=.95;speechSynthesis.speak(u)}catch(e){}}
      function show(n,user=false){i=(n+scenes.length)%scenes.length;const s=scenes[i];el('eyebrow').textContent=s.eye;el('title').innerHTML=s.title;el('lead').textContent=s.lead;el('points').innerHTML=s.points.map(x=>`<article class="point"><b>${x[0]}</b><span>${x[1]}</span></article>`).join('');el('caption').textContent=`장면 ${i+1}. ${s.speech}`;el('count').textContent=`${i+1} / ${scenes.length}`;el('presenter').src=s.img;elapsed=0;start=performance.now();fill.style.width='0';stage.classList.remove('flash');void stage.offsetWidth;stage.classList.add('flash');if(user||playing)speak()}
      function tick(t){if(playing){elapsed=t-start;fill.style.width=Math.min(100,elapsed/duration*100)+'%';if(elapsed>=duration)show(i+1)}requestAnimationFrame(tick)}el('prev').onclick=()=>show(i-1,true);el('next').onclick=()=>show(i+1,true);play.onclick=()=>{playing=!playing;play.textContent=playing?'일시정지':'재생';start=performance.now()-elapsed;if(playing)speak()};el('voice').onclick=e=>{voiceOn=!voiceOn;e.currentTarget.textContent=voiceOn?'🔊 음성 켜짐':'🔇 음성 꺼짐';if(voiceOn)speak();else speechSynthesis?.cancel()};window.__SARANGBANG_ROUTE_COMMAND__=text=>{const q=String(text||'').replace(/[\s·._-]+/g,'').toLowerCase();if(/다음/.test(q)){show(i+1,true);return true}if(/이전/.test(q)){show(i-1,true);return true}if(/독특|특징/.test(q)){show(1,true);return true}if(/사용|주의|라벨/.test(q)){show(2,true);return true}if(/구매|본사|공식몰/.test(q)){show(3,true);return true}if(/음성|해설/.test(q)){el('voice').click();return true}return false};show(0);requestAnimationFrame(tick)})();
  </script><script src="melaleuca-web-voice.js"></script>
