  <style>
    :root{--ink:#123e36;--muted:#58766e;--green:#078269;--mint:#65e2be;--line:#cfe7df;--paper:#fff;--wash:#eafbf5;--shadow:0 24px 70px #236b5626}
    *{box-sizing:border-box}html{font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;background:#f6fffc;color:var(--ink)}body{margin:0;overflow-x:hidden}button,a{font:inherit}
    .top{position:fixed;inset:0 0 auto;z-index:80;display:grid;grid-template-columns:46px minmax(0,1fr) auto;gap:10px;align-items:center;padding:calc(9px + env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) 9px max(12px,env(safe-area-inset-left));background:#ffffffed;border-bottom:1px solid var(--line);backdrop-filter:blur(18px)}
    .top>a,.top button{height:44px;border:0;border-radius:14px;background:#e2f8f0;color:var(--green);display:grid;place-items:center;text-decoration:none;font-weight:900}.brand{min-width:0}.brand b,.brand small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.brand b{font-size:15px}.brand small{margin-top:2px;color:var(--muted);font-size:11px}.top-actions{display:flex;gap:7px}.top-actions a{min-height:44px;padding:10px 13px;border-radius:14px;background:var(--green);color:#fff;text-decoration:none;display:grid;place-items:center;font-size:12px;font-weight:900}.top-actions a.pdf{background:#fff1c8;color:#705300;border:1px solid #ead083}
    .cinema{--accent:#65e2be;--scene:#eafbf5;position:relative;min-height:100svh;padding:94px max(20px,calc((100% - 1180px)/2)) 158px;background:radial-gradient(circle at 88% 12%,color-mix(in srgb,var(--accent) 32%,transparent),transparent 27%),linear-gradient(145deg,#fff 0%,var(--scene) 70%);transition:background .65s ease;overflow:hidden}
    .cinema:before,.cinema:after{content:"";position:absolute;border-radius:50%;pointer-events:none}.cinema:before{width:360px;height:360px;left:-180px;bottom:50px;background:color-mix(in srgb,var(--accent) 18%,transparent)}.cinema:after{width:220px;height:220px;right:-90px;bottom:130px;border:38px solid color-mix(in srgb,var(--accent) 18%,transparent)}
    .stage{position:relative;z-index:2;min-height:calc(100svh - 252px);display:grid;grid-template-columns:minmax(0,.92fr) minmax(340px,.78fr);gap:clamp(24px,5vw,68px);align-items:center}
    .story{padding:18px 0}.eyebrow{display:inline-flex;align-items:center;gap:8px;padding:7px 11px;border-radius:999px;background:#fff;border:1px solid var(--line);box-shadow:0 8px 22px #2a735516;color:var(--green);font-size:11px;font-weight:950;letter-spacing:.6px}.eyebrow:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent)}
    h1{max-width:650px;margin:18px 0 14px;font-size:clamp(42px,6.7vw,76px);line-height:1.04;letter-spacing:-2.6px;text-wrap:balance}.lead{max-width:650px;margin:0;color:#365e54;font-size:clamp(17px,2vw,21px);line-height:1.68;text-wrap:balance}.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:25px 0 0}.fact{min-height:106px;padding:15px;border:1px solid var(--line);border-radius:19px;background:#ffffffd9;box-shadow:0 12px 30px #21614912;opacity:0;transform:translateY(16px);animation:factIn .52s ease forwards}.fact:nth-child(2){animation-delay:.14s}.fact:nth-child(3){animation-delay:.28s}.fact b,.fact span{display:block}.fact b{color:var(--green);font-size:14px}.fact span{margin-top:7px;color:#496c63;font-size:13px;line-height:1.5}.links{display:flex;flex-wrap:wrap;gap:9px;margin-top:22px}.links a{min-height:50px;padding:12px 16px;border-radius:15px;background:var(--green);color:#fff;display:grid;place-items:center;text-decoration:none;font-size:14px;font-weight:900}.links a.soft{background:#fff;color:var(--green);border:1px solid #a8d9ca}.source-note{margin-top:12px;color:var(--muted);font-size:12px;line-height:1.5}
    .document{position:relative;justify-self:center;width:min(100%,470px);perspective:1300px}.pdf-sheet{position:relative;overflow:hidden;border-radius:24px;background:#fff;box-shadow:var(--shadow);border:1px solid #d7ebe5;transform-origin:left center}.pdf-sheet.turning{animation:pageTurn .66s cubic-bezier(.2,.75,.3,1)}.pdf-sheet img{display:block;width:100%;height:auto;aspect-ratio:595/842;object-fit:cover}.page-label{position:absolute;left:14px;top:14px;padding:8px 10px;border-radius:12px;background:#ffffffec;border:1px solid #cae6dd;color:var(--green);font-size:11px;font-weight:950;box-shadow:0 7px 20px #0b5a421a}.presenter{position:absolute;right:-24px;bottom:-22px;width:112px;height:112px;border-radius:50%;object-fit:cover;border:7px solid #fff;box-shadow:0 16px 35px #145b4538}.page-corner{position:absolute;right:0;bottom:0;width:72px;height:72px;background:linear-gradient(135deg,#cceee300 49%,color-mix(in srgb,var(--accent) 52%,#fff) 51%);filter:drop-shadow(-6px -5px 8px #1c5d4318)}
    .caption{position:fixed;z-index:65;left:50%;bottom:116px;transform:translateX(-50%);width:min(calc(100% - 30px),830px);padding:10px 14px;border:1px solid #cfe8df;border-radius:14px;background:#fffffff0;color:#2f5b50;text-align:center;font-size:13px;line-height:1.5;box-shadow:0 12px 36px #1a5c4318;backdrop-filter:blur(12px)}
    .controls{position:fixed;z-index:70;left:50%;bottom:calc(15px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(calc(100% - 26px),880px);padding:11px;border:1px solid #c9e5dc;border-radius:21px;background:#fffffff0;box-shadow:0 18px 48px #19583f25;backdrop-filter:blur(18px)}.timeline{height:6px;border-radius:99px;background:#dcefe9;overflow:hidden}.progress{width:0;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--green),var(--accent))}.control-row{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto auto;gap:8px;align-items:center;margin-top:9px}.control-row button{height:44px;min-width:44px;padding:0 13px;border:0;border-radius:13px;background:#e7f7f1;color:var(--green);font-weight:950}.control-row .play{background:var(--green);color:#fff}.counter{text-align:center;color:#507168;font-size:12px}.dots{display:flex;justify-content:center;gap:7px;margin-top:5px}.dot{width:8px!important;height:8px!important;min-width:8px!important;padding:0!important;border-radius:50%!important;background:#b9d8cf!important}.dot.on{background:var(--accent)!important;transform:scale(1.35)}.voice.on{box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 32%,transparent);background:var(--accent);color:#113f35}
    @keyframes factIn{to{opacity:1;transform:none}}@keyframes pageTurn{0%{opacity:.35;transform:rotateY(-18deg) translateX(16px)}55%{opacity:.9;transform:rotateY(4deg)}100%{opacity:1;transform:none}}@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
    @media(max-width:780px){.top{grid-template-columns:44px minmax(0,1fr) auto}.top-actions a.pdf{display:none}.top-actions a{padding:8px 10px}.cinema{padding:82px 16px 178px;min-height:auto}.stage{min-height:auto;grid-template-columns:1fr;gap:16px;align-items:start}.story{padding:15px 0 0}.eyebrow{font-size:10px}h1{font-size:clamp(34px,10vw,50px);letter-spacing:-1.6px;margin:12px 0 8px}.lead{font-size:15px;line-height:1.56}.facts{gap:7px;margin-top:15px}.fact{min-height:89px;padding:11px;border-radius:15px}.fact b{font-size:12px}.fact span{font-size:11px;line-height:1.42}.links{margin-top:14px}.links a{min-height:44px;font-size:12px}.source-note{font-size:10px}.document{width:min(82vw,340px);padding-bottom:18px}.presenter{width:86px;height:86px;right:-14px;bottom:2px;border-width:5px}.caption{bottom:137px;font-size:11px;padding:8px 10px}.control-row{grid-template-columns:auto auto minmax(0,1fr) auto}.control-row .voice{grid-column:1/-1}.controls{bottom:calc(10px + env(safe-area-inset-bottom));padding:9px}.top .brand small{font-size:10px}}
    @media(max-width:460px){.facts{grid-template-columns:1fr}.fact{min-height:0}.document{width:min(78vw,310px)}}
  </style>

<body>
  <header class="top">
    <a href="index.html" aria-label="홈으로">←</a>
    <div class="brand"><b>공식자료 오버뷰</b><small>밝은 PDF 장면 · 생동감 음성 · 공식 원문 연결</small></div>
    <div class="top-actions"><a class="pdf" href="downloads/melaleuca-official-overview-guide.pdf" target="_blank" rel="noopener">PDF 5장</a><a href="melaleuca-ai.html">AI 질문</a></div>
  </header>

  <main class="cinema" id="cinema">
    <section class="stage" aria-live="polite">
      <div class="story" id="story">
        <span class="eyebrow" id="eyebrow"></span>
        <h1 id="title"></h1>
        <p class="lead" id="lead"></p>
        <div class="facts" id="facts"></div>
        <div class="links"><a id="source" target="_blank" rel="noopener">멜라루카 공식 원문</a><a class="soft" href="downloads/melaleuca-official-overview-guide.pdf" target="_blank" rel="noopener">밝은 PDF 내려받기</a></div>
        <p class="source-note">공식 페이지의 핵심을 독립적으로 재작성한 요약입니다. 상품 이미지와 원문은 복제하지 않으며 최신 공식 화면을 우선합니다.</p>
      </div>
      <div class="document">
        <div class="pdf-sheet" id="sheet"><span class="page-label" id="pageLabel"></span><img id="pdfPage" alt="멜라루카 공식자료 요약 PDF 페이지"><span class="page-corner"></span></div>
        <img class="presenter" id="presenter" alt="공식자료를 설명하는 안내 모델">
      </div>
    </section>
  </main>

  <p class="caption" id="caption"></p>
  <div class="controls">
    <div class="timeline"><div class="progress" id="progress"></div></div>
    <div class="control-row">
      <button id="prev" aria-label="이전 장면">‹</button>
      <button class="play" id="play">일시정지</button>
      <div><div class="counter" id="counter"></div><div class="dots" id="dots"></div></div>
      <button id="next" aria-label="다음 장면">›</button>
      <button class="voice" id="voice">🎙 음성 해설</button>
    </div>
  </div>

  <script>
    (()=>{
      const scenes=[
        {tag:'OFFICIAL 01 · COMPANY',title:'멜라루카의 사명과<br>여섯 가지 핵심 요소',lead:'공식 스토리는 이웃들의 목표 성취와 삶의 향상을 돕는 것을 회사의 사명으로 설명합니다.',facts:[['공식 사명','회사 방향을 먼저 확인'],['여섯 요소','건강·관계·안정·목적·평화·자유'],['확인 원칙','정확한 원문은 공식 페이지에서']],speech:'첫 번째 공식자료입니다. 멜라루카 코리아 공식 스토리는 이웃들의 목표 성취와 삶의 향상을 돕는 것을 회사의 사명으로 설명합니다. 건강한 신체, 좋은 관계, 재정의 안정, 목적, 평화, 자유라는 여섯 가지 핵심 요소도 함께 소개합니다.',source:'https://kr.melaleuca.com/our-story',page:'assets/overview-pdf-1.png',model:'assets/overview-presenter-1.webp',accent:'#65e2be',scene:'#eafbf5'},
        {tag:'OFFICIAL 02 · MEMBERSHIP',title:'우대회원 혜택은<br>공식 최신 조건으로',lead:'할인·선물·적립·무료 배송·VIP 등 현재 공개된 항목을 살펴보고 가입 직전 조건을 다시 확인합니다.',facts:[['공개 혜택','30~50% 할인 안내'],['가입 초기','6개월 차까지 선물 항목'],['최종 확인','적용 대상·기간·포인트']],speech:'두 번째는 우대회원 안내입니다. 공식 페이지에는 30에서 50퍼센트 할인, 등록 6개월 차까지 총 5회의 선물, 최대 20퍼센트 로열티쇼핑달러, 35포인트 무료 배송과 VIP 프로그램이 소개되어 있습니다. 적용 조건은 바뀔 수 있으니 가입 직전 공식 화면을 확인하세요.',source:'https://kr.melaleuca.com/our-story/become-a-member',page:'assets/overview-pdf-2.png',model:'assets/overview-presenter-2.webp',accent:'#73c7ff',scene:'#ecf7ff'},
        {tag:'OFFICIAL 03 · BUSINESS',title:'일곱 가지 핵심 활동을<br>순서대로 이해하기',lead:'공식 비즈니스 FAQ가 제시하는 활동을 시작·성장·리더십의 흐름으로 정리했습니다.',facts:[['시작','명단·약속·프레젠테이션'],['성장','전략·축하·패스트 트랙'],['리더십','리더의 솔선수범']],speech:'세 번째는 비즈니스 활동입니다. 공식 안내의 일곱 가지는 지속적인 가망고객 명단 작성, 약속 잡기, 프레젠테이션, 전략 세션, 성공 축하, 패스트 트랙 참석, 그리고 리더의 솔선수범입니다. 활동은 배움과 실행의 기준이며 수익을 보장하지는 않습니다.',source:'https://kr.melaleuca.com/help-center/faq/business-development/building-your-business',page:'assets/overview-pdf-3.png',model:'assets/overview-presenter-3.webp',accent:'#ffcc70',scene:'#fff8e8'},
        {tag:'OFFICIAL 04 · COMPENSATION',title:'보상은 기대보다<br>공개자료와 조건이 먼저',lead:'평균 후원 수당의 기간과 대상 범위를 정확히 읽고, 개인 수익을 보장하는 표현은 사용하지 않습니다.',facts:[['공개 기간','2025년 1월~12월'],['자료 대상','수당을 받은 판매원 분포'],['교차 확인','공식 페이지·공정거래위원회']],speech:'네 번째는 평균 후원 수당 공개자료입니다. 현재 공식 페이지는 2025년 1월부터 12월까지의 자료이며, 후원수당을 지급받은 판매원만의 지급분포도라고 명시합니다. 평균 자료는 개인의 수익이나 승급을 보장하는 약속이 아닙니다.',source:'https://kr.melaleuca.com/help-center/sudang',page:'assets/overview-pdf-4.png',model:'assets/overview-presenter-1.webp',accent:'#e6a7ff',scene:'#faf0ff'},
        {tag:'OFFICIAL 05 · SAFE GUIDE',title:'AI 음성안내와<br>공식 원문을 함께 보기',lead:'AI가 핵심을 쉬운 말로 설명하고, 중요한 판단은 PDF와 공식 원문으로 다시 확인하도록 연결합니다.',facts:[['질문 범위','회사·회원·제품·사업·보상'],['정보 보호','민감정보 입력 금지'],['전문 판단','법률·세무·의료 전문가 확인']],speech:'마지막은 안전한 AI 안내입니다. 회사, 회원, 제품, 사업, 보상에 관한 공개정보를 쉬운 말과 음성으로 설명합니다. 가격과 재고, 약관과 수당은 공식 최신 화면이 우선이며, 개인정보나 전문 판단이 필요한 내용은 입력하지 마세요.',source:'https://kr.melaleuca.com/',page:'assets/overview-pdf-5.png',model:'assets/overview-presenter-2.webp',accent:'#ff9fb8',scene:'#fff0f4'}
      ];
      const el=id=>document.getElementById(id),cinema=el('cinema'),sheet=el('sheet'),facts=el('facts'),progress=el('progress'),play=el('play'),voice=el('voice');
      let i=0,playing=true,voiceOn=false,start=performance.now(),elapsed=0;const duration=13500;
      scenes.forEach((_,n)=>{const b=document.createElement('button');b.className='dot'+(n===0?' on':'');b.setAttribute('aria-label',`${n+1}번 장면`);b.onclick=()=>show(n,true);el('dots').append(b)});
      const speak=()=>{if(!voiceOn)return;const message=scenes[i].speech;if(window.__SARANGBANG_SPEAK__)window.__SARANGBANG_SPEAK__(message,{mood:'presenter'});else try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(message);u.lang='ko-KR';u.rate=.98;u.pitch=1.05;speechSynthesis.speak(u)}catch(e){}};
      function show(n,user=false){
        i=(n+scenes.length)%scenes.length;const s=scenes[i];cinema.style.setProperty('--accent',s.accent);cinema.style.setProperty('--scene',s.scene);el('eyebrow').textContent=s.tag;el('title').innerHTML=s.title;el('lead').textContent=s.lead;facts.innerHTML=s.facts.map(x=>`<article class="fact"><b>${x[0]}</b><span>${x[1]}</span></article>`).join('');el('source').href=s.source;el('pdfPage').src=s.page;el('pdfPage').alt=`${i+1}쪽 ${s.title.replace(/<br>/g,' ')}`;el('presenter').src=s.model;el('pageLabel').textContent=`PDF ${i+1} / ${scenes.length}`;el('counter').textContent=`${i+1} / ${scenes.length} · ${s.tag.split(' · ')[1]}`;el('caption').textContent=`장면 ${i+1}. ${s.speech}`;[...el('dots').children].forEach((d,n)=>d.classList.toggle('on',n===i));sheet.classList.remove('turning');void sheet.offsetWidth;sheet.classList.add('turning');elapsed=0;start=performance.now();progress.style.width='0';if(user||playing)speak()
      }
      function stopVoice(){window.__SARANGBANG_STOP_SPEAK__?window.__SARANGBANG_STOP_SPEAK__():speechSynthesis?.cancel()}
      function tick(t){if(playing){elapsed=t-start;progress.style.width=Math.min(100,elapsed/duration*100)+'%';if(elapsed>=duration)show(i+1)}requestAnimationFrame(tick)}
      el('prev').onclick=()=>show(i-1,true);el('next').onclick=()=>show(i+1,true);play.onclick=()=>{playing=!playing;play.textContent=playing?'일시정지':'재생';start=performance.now()-elapsed;if(playing)speak();else stopVoice()};voice.onclick=()=>{voiceOn=!voiceOn;voice.classList.toggle('on',voiceOn);voice.textContent=voiceOn?'🔊 음성 해설 켜짐':'🎙 음성 해설';if(voiceOn)speak();else stopVoice()};
      let touchX=0;cinema.addEventListener('touchstart',e=>touchX=e.changedTouches[0].clientX,{passive:true});cinema.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-touchX;if(Math.abs(dx)>55)show(i+(dx<0?1:-1),true)},{passive:true});
      window.__SARANGBANG_ROUTE_COMMAND__=text=>{const q=String(text||'').replace(/[\s·._-]+/g,'').toLowerCase();if(/다음/.test(q)){show(i+1,true);return true}if(/이전/.test(q)){show(i-1,true);return true}if(/회사|사명|처음/.test(q)){show(0,true);return true}if(/회원|혜택|가입/.test(q)){show(1,true);return true}if(/사업|활동/.test(q)){show(2,true);return true}if(/보상|수당/.test(q)){show(3,true);return true}if(/안전|상담|에이아이|ai/.test(q)){show(4,true);return true}if(/음성|해설/.test(q)){voice.click();return true}return false};
      show(0);requestAnimationFrame(tick)
    })();
  </script>
  <script src="melaleuca-web-voice.js"></script>
</body>
