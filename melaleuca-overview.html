  <script>
    (function(){
      var scenes=JSON.parse(document.getElementById('overviewData').textContent);
      var el=function(id){return document.getElementById(id)};
      var cinema=el('cinema'),sheet=el('sheet'),facts=el('facts'),progress=el('progress'),play=el('play'),voice=el('voice'),jump=el('pageJump');
      var i=0,playing=true,voiceOn=false,start=performance.now(),elapsed=0;
      var duration=50000,totalDuration=scenes.length*duration;
      var models=['assets/overview-presenter-1.webp','assets/overview-presenter-2.webp','assets/overview-presenter-3.webp'];
      scenes.forEach(function(scene,n){
        scene.page='assets/overview-pdf-'+(n+1)+'.png';
        scene.model=models[n%models.length];
        var option=document.createElement('option');
        option.value=String(n);
        option.textContent=String(n+1).padStart(2,'0')+' · '+scene.title.replace(/<br\s*\/?>/g,' ');
        jump.append(option);
      });
      function formatTime(seconds){
        var value=Math.max(0,Math.ceil(seconds));
        return Math.floor(value/60)+'분 '+String(value%60).padStart(2,'0')+'초';
      }
      function speak(){
        if(!voiceOn)return;
        var message=scenes[i].speech;
        if(window.__SARANGBANG_SPEAK__)window.__SARANGBANG_SPEAK__(message,{mood:'presenter'});
        else try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(message);u.lang='ko-KR';u.rate=.96;u.pitch=1.05;speechSynthesis.speak(u)}catch(e){}
      }
      function show(n,user){
        i=(n+scenes.length)%scenes.length;
        var s=scenes[i];
        cinema.style.setProperty('--accent',s.accent);
        cinema.style.setProperty('--scene',s.scene);
        el('eyebrow').textContent=s.tag;
        el('title').innerHTML=s.title;
        el('lead').textContent=s.lead;
        facts.innerHTML=s.facts.map(function(x){return '<article class="fact"><b>'+x[0]+'</b><span>'+x[1]+'</span></article>'}).join('');
        el('source').href=s.source;
        if(i===0){el('videoLink').hidden=false;el('videoLink').href='https://youtu.be/Zdi5CWfiNDA?si=tNb_HU9cK9uPma3m';el('videoLink').textContent='멜라루카 웰컴 비디오 ▶'}
        else if(/^성공의 7단계/.test(s.tag)){el('videoLink').hidden=false;el('videoLink').href='https://www.youtube.com/results?search_query=%EB%A9%9C%EB%9D%BC%EB%A3%A8%EC%B9%B4+7%EA%B0%80%EC%A7%80+%ED%95%B5%EC%8B%AC+%EC%82%AC%EC%97%85+%ED%99%9C%EB%8F%99';el('videoLink').textContent='유튜브 영상 검색'}
        else el('videoLink').hidden=true;
        el('pdfPage').src=s.page;
        el('pdfPage').alt=String(i+1)+'쪽 '+s.title.replace(/<br\s*\/?>/g,' ');
        el('presenter').src=s.model;
        el('pageLabel').textContent='PDF '+String(i+1)+' / '+String(scenes.length);
        jump.value=String(i);
        el('caption').textContent='장면 '+String(i+1)+'. '+s.speech;
        sheet.classList.remove('turning');
        void sheet.offsetWidth;
        sheet.classList.add('turning');
        elapsed=0;
        start=performance.now();
        progress.style.width='0';
        updateCounter();
        if(user||playing)speak();
      }
      function updateCounter(){
        var remaining=totalDuration-(i*duration+elapsed);
        el('counter').textContent=String(i+1)+' / '+String(scenes.length)+' · 전체 약 20분 · '+formatTime(remaining)+' 남음';
      }
      function stopVoice(){
        if(window.__SARANGBANG_STOP_SPEAK__)window.__SARANGBANG_STOP_SPEAK__();
        else if(window.speechSynthesis)speechSynthesis.cancel();
      }
      function tick(t){
        if(playing){
          elapsed=t-start;
          progress.style.width=Math.min(100,elapsed/duration*100)+'%';
          updateCounter();
          if(elapsed>=duration)show(i+1,false);
        }
        requestAnimationFrame(tick);
      }
      el('prev').onclick=function(){show(i-1,true)};
      el('next').onclick=function(){show(i+1,true)};
      jump.onchange=function(){show(Number(jump.value),true)};
      play.onclick=function(){
        playing=!playing;
        play.textContent=playing?'일시정지':'재생';
        start=performance.now()-elapsed;
        if(playing)speak();else stopVoice();
      };
      voice.onclick=function(){
        voiceOn=!voiceOn;
        voice.classList.toggle('on',voiceOn);
        voice.textContent=voiceOn?'🔊 음성 해설 켜짐':'🎙 음성 해설';
        if(voiceOn)speak();else stopVoice();
      };
      var touchX=0;
      cinema.addEventListener('touchstart',function(e){touchX=e.changedTouches[0].clientX},{passive:true});
      cinema.addEventListener('touchend',function(e){var dx=e.changedTouches[0].clientX-touchX;if(Math.abs(dx)>55)show(i+(dx<0?1:-1),true)},{passive:true});
      window.__SARANGBANG_ROUTE_COMMAND__=function(text){
        var q=String(text||'').replace(/[\s·._-]+/g,'').toLowerCase();
        if(/다음/.test(q)){show(i+1,true);return true}
        if(/이전/.test(q)){show(i-1,true);return true}
        if(/처음|안내/.test(q)){show(0,true);return true}
        if(/회사|사명/.test(q)){show(1,true);return true}
        if(/성분|자연|과학/.test(q)){show(7,true);return true}
        if(/회원|혜택|가입/.test(q)){show(10,true);return true}
        if(/제품|카테고리/.test(q)){show(14,true);return true}
        if(/성공|7단계|일곱단계|사업활동/.test(q)){show(20,true);return true}
        if(/음성|해설/.test(q)){voice.click();return true}
        return false;
      };
      show(0,false);
      requestAnimationFrame(tick);
    })();
  </script>
  <script src="melaleuca-web-voice.js"></script>
