function run(id){if(id==='mic'){voiceTap();return}stopVoice();const p=PROJ.find(x=>x.id===id);if(p){location.hash='project/'+id;return}const i=items.find(x=>x.id===id);if(!i)return;if(['cover','photoedit','bizcard'].includes(id)){location.hash='project/cover';return}if(id==='meeting-veliqo'){location.hash='project/veliqo';return}if(id==='hub'){location.hash='';category='all';renderHome();return}if(id==='system'){settings();return}if(id==='export'){exportSettings();return}if(['phone','sms'].includes(id)){phoneDialog(id);return}if(['camera','photos','files'].includes(id)){fileDialog(id);return}if(id==='calc'){calculator();return}if(id==='daily'||id==='snotes'){notes(id);return}if(id==='alarm'){alarm();return}if(id==='directions'){directions();return}if(id==='contacts'){contacts();return}if(id==='bank'){dialog('인터넷뱅킹',`<p>사용하시는 은행의 공식 앱이나 사이트에서 진행해 주세요. 허브는 계좌번호·비밀번호를 수집하지 않습니다.</p>${external('https://www.kbstar.com/','KB국민은행')}${external('https://www.shinhan.com/','신한은행')}${external('https://www.wooribank.com/','우리은행')}`);return}if(id==='sinternet'){dialog(i.title,`<p>웹 허브에서는 특정 브라우저 앱의 실행 여부를 확인할 수 없습니다. 아래 버튼은 현재 브라우저에서 검색을 엽니다.</p>${external('https://www.google.com/','웹 검색 열기')}`);return}if(i.url){const a=document.createElement('a');a.href=safeURL(i.url);a.target='_blank';a.rel='noopener noreferrer';document.body.append(a);a.click();a.remove();toast(i.title+' 새 창 열기');}}

function command(raw){stopVoice();if(!String(raw).trim()){toast('명령이나 검색어를 입력해 주세요.');return}const n=norm(raw);if(['홈','처음','허브'].includes(n)){location.hash='';category='all';renderHome();return}const aliases={'왁시스':'waaxxss','락시스':'waaxxss','벨리코':'veliqo','멜라루카':'melaleuca','리버스':'reverse12','리버스12':'reverse12','지메일':'gmail','카톡':'kakao','계산기':'calc','사진편집':'photoedit','회의장':'meeting-veliqo','지도':'directions','알람':'alarm','파일':'files','사진':'photos','크롬':'chrome','아우소':'ausoai','엑설런트':'excellent','피이사':'excellent','p이사':'excellent','남구를잇다':'namgu','브이잇다':'vitda','일정':'schedule','메일':'gmail','문서편집':'docpdf'};let id=aliases[n];if(!id){const found=[...PROJ,...items].sort((a,b)=>b.title.length-a.title.length).find(x=>norm(x.title)===n||norm(x.sub||'')===n);id=found?.id}if(id){run(id);return}dialog('검색어 확인',`<p><strong>${esc(raw)}</strong></p><p>일치하는 허브 명령이 없습니다. 아래에서 검색할 수 있습니다.</p>${external('https://www.google.com/search?q='+encodeURIComponent(raw),'Google 검색')}${external('https://search.naver.com/search.naver?query='+encodeURIComponent(raw),'NAVER 검색')}`)}
let rec=null,voiceState='idle',spoken='',feedback='',voiceConsent=false,voiceEpoch=0;

function voiceInfo(){dialog('마이크 · 음성 명령',`<p>버튼을 누른 동안에만 듣고, 인식한 문장은 <strong>실행</strong> 버튼으로 확인합니다. 대기 중에는 소리나 안내 음성이 나오지 않습니다.</p><div class="warning"><strong>본인 목소리만 인식하는 기능은 아직 연결되지 않았습니다.</strong><br>주변 사람의 말도 인식될 수 있습니다. 현재 기능은 음성 명령 입력이며, 일반 AI 대화 기능은 아닙니다.</div><p>브라우저의 음성 인식 서비스는 음성을 서버로 보내 처리할 수 있습니다. 허브 자체는 음성 녹음을 저장하지 않습니다.</p><button class="btn primary" id="agreeVoice">안내 확인 · 마이크 시작</button>`);$('#agreeVoice').onclick=()=>{voiceConsent=true;dlg.close();voiceTap()}}

function calculate(s){const a=s.replace(/\s/g,'').match(/(?:\d+(?:\.\d*)?|\.\d+)|[()+\-*/%]/g)||[];if(a.join('')!==s.replace(/\s/g,''))throw Error('사용할 수 없는 문자');let i=0;const factor=()=>{if(a[i]==='+'){i++;return factor()}if(a[i]==='-'){i++;return-factor()}if(a[i]==='('){i++;const v=expr();if(a[i++]!==')')throw Error('괄호 오류');return v}const token=a[i++];if(token===undefined||!/^(?:\d+(?:\.\d*)?|\.\d+)$/.test(token))throw Error('숫자를 확인해 주세요');return Number(token)};const term=()=>{let v=factor();while(['*','/','%'].includes(a[i])){const o=a[i++],n=factor();if((o==='/'||o==='%')&&n===0)throw Error('0으로 나눌 수 없습니다');v=o==='*'?v*n:o==='/'?v/n:v%n}return v};const expr=()=>{let v=term();while(['+','-'].includes(a[i])){const o=a[i++],n=term();v=o==='+'?v+n:v-n}return v};const r=expr();if(i!==a.length||!Number.isFinite(r))throw Error('계산식을 확인해 주세요');return Number(r.toPrecision(12))}

function alarm(){dialog('알람 · 웹 타이머',`<p class="warning">이 페이지를 열어 둔 동안만 작동하는 타이머입니다. 휴대폰이 잠기거나 브라우저가 닫히면 알림을 보장하지 않습니다. 시스템 알람을 대신하지 않습니다.</p><label>몇 분 후<input id="timerMinutes" type="number" min="1" max="1440" value="5"></label><div class="countdown" id="countdown">05:00</div><div class="row2"><button class="btn primary" id="startTimer">시작</button><button class="btn" id="stopTimer">정지</button></div><small>종료 시 화면으로 알립니다. 소리는 재생하지 않습니다.</small>`);const clear=()=>{clearInterval(countTimer);countTimer=null};dialogCleanup=clear;$('#stopTimer').onclick=()=>{clear();$('#countdown').textContent='정지'};$('#startTimer').onclick=()=>{const min=Number($('#timerMinutes').value);if(!Number.isFinite(min)||min<1||min>1440){toast('1~1440분을 입력해 주세요.');return}clear();const end=Date.now()+min*60000;const tick=()=>{const s=Math.max(0,Math.ceil((end-Date.now())/1000));const el=$('#countdown');if(!el){clear();return}el.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');if(s===0){clear();el.textContent='시간이 되었습니다';toast('타이머가 끝났습니다.')}};tick();countTimer=setInterval(tick,500)}}
function directions(){dialog('지도 · 길찾기',`<label>출발지<input id="origin" placeholder="예: 대구역"></label><label>도착지<input id="destination" placeholder="예: 동대구역"></label><button class="btn primary" id="makeRoute">길찾기 링크 만들기</button><div id="routeLink"></div><div class="row2">${external('https://map.naver.com/','네이버 지도')}${external('https://map.kakao.com/','카카오맵')}</div><p class="note">출발·도착지를 Google Maps에 전달합니다. 네이버·카카오 지도는 원본 지도에서 경로를 입력해 주세요.</p>`);$('#makeRoute').onclick=()=>{const a=$('#origin').value.trim(),b=$('#destination').value.trim();if(!a||!b){toast('출발지와 도착지를 입력해 주세요.');return}$('#routeLink').innerHTML=external('https://www.google.com/maps/dir/?api=1&origin='+encodeURIComponent(a)+'&destination='+encodeURIComponent(b),'Google Maps 길찾기 열기')}}
function contacts(){dialog('연락처 선택',`<p>기기가 지원하는 경우 직접 선택한 연락처만 표시합니다. 허브가 주소록 전체를 읽거나 업로드하지 않습니다.</p><button class="btn primary" id="selectContact">기기 연락처 선택</button><pre id="contactResult" style="white-space:pre-wrap"></pre>`);$('#selectContact').onclick=async()=>{if(!navigator.contacts?.select){toast('이 브라우저는 연락처 선택을 지원하지 않습니다. 휴대폰 연락처 앱을 이용해 주세요.');return}try{const list=await navigator.contacts.select(['name','tel'],{multiple:false});const target=$('#contactResult');if(target)target.textContent=list.map(x=>(x.name||[]).join(' ')+'\n'+(x.tel||[]).join('\n')).join('\n')}catch{toast('연락처 선택을 취소했거나 권한이 허용되지 않았습니다.')}}}
function settings(){dialog('내 허브 설정',`<p>프로젝트 로고·표지·연결 주소는 각 프로젝트 작업실에서 수정합니다. <strong>이 브라우저에만 저장</strong>되며 다른 방문자의 화면을 변경하지 않습니다.</p><div class="warning">본인 음성 인증: 미연결<br>일반 AI 대화 서버: 미연결<br>프로젝트 외부 사이트의 최신 수정본 여부: 별도 확인 필요</div><button class="btn primary" id="exportSettings">프로젝트 설정 백업</button><label>설정 백업 복원<input id="importSettings" type="file" accept="application/json,.json"></label><button class="btn" id="voiceDetails">음성 안내</button><p class="note">HUB ${VERSION} · 기존 허브와 별개인 테스트 화면입니다. 기존 사이트의 코드·회원 정보·결제 정보는 이 허브에 복사하지 않았습니다.</p>`);$('#exportSettings').onclick=exportSettings;$('#voiceDetails').onclick=voiceInfo;$('#importSettings').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>24*1024*1024)throw Error('백업 파일은 24MB 이하여야 합니다.');const data=JSON.parse(await f.text());if(data.schema!==STORAGE||!Array.isArray(data.drafts)||data.drafts.length>12)throw Error('허브 백업 파일이 아닙니다.');const valid=[];for(const raw of data.drafts){if(!PROJ.some(p=>p.id===raw.id)&&raw.id!=='cover')throw Error('알 수 없는 프로젝트');const d=baseDraft(raw.id);for(const k of ['title','description'])if(typeof raw[k]==='string')d[k]=raw[k].slice(0,k==='title'?60:120);d.url=safeURL(raw.url);for(const k of ['logo','cover']){if(raw[k]){if(typeof raw[k]!=='string'||!/^data:image\/(png|jpeg|webp);base64,[A-Za-z0-9+/=]+$/.test(raw[k])||raw[k].length>17*1024*1024)throw Error('이미지 형식 오류');await loadImage(raw[k]);d[k]=raw[k]}else d[k]=''}for(const k of ['x','y'])d[k]=Math.min(5000,Math.max(-5000,Number(raw[k])||0));d.zoom=Math.min(4,Math.max(.25,Number(raw.zoom)||1));d.rotation=[0,90,180,270].includes(raw.rotation)?raw.rotation:0;d.fit=raw.fit==='cover'?'cover':'contain';d.caption=raw.caption!==false;d.updatedAt=Date.now();valid.push(d)}if(!window.confirm('이 브라우저의 해당 프로젝트 설정을 백업 내용으로 바꾸시겠습니까?'))return;for(const d of valid){await dbSave(d);drafts[d.id]=d}dlg.close();renderHome();toast('백업 설정을 복원했습니다.')}catch(err){toast('복원 실패: '+err.message)}}}
async function exportSettings(){try{const all=await dbAll();download(JSON.stringify({schema:STORAGE,version:VERSION,exportedAt:new Date().toISOString(),drafts:all},null,2),'AUSOAI-hub-settings.json','application/json');toast('프로젝트 설정을 백업했습니다.')}catch{toast('설정을 읽지 못했습니다. 기기 저장 권한을 확인해 주세요.')}}
function route(){++routeToken;stopVoice();if(dlg.open)dlg.close();workspace=null;const m=location.hash.match(/^#project\/([a-z0-9-]+)$/);if(m)room(m[1]);else renderHome();window.scrollTo(0,0)}
window.addEventListener('hashchange',route);route();dbAll().then(list=>{drafts=Object.fromEntries(list.map(d=>[d.id,d]));if(!location.hash||location.hash==='#')renderSections();else if(workspace&&!historyStack.length){const id=roomId;room(id)}}).catch(()=>toast('기기 저장 공간을 사용할 수 없어 임시 모드로 열었습니다.'));
window.HUB_TEST={calculate,projects:PROJ,items};
})();
</script><script>
/* AUSOAI_OS_LAYER_20260924 */
(()=>{
'use strict';
const KEY='ausoai-os-language-v1';
const btn=document.getElementById('osTranslateBtn');
const orig=document.getElementById('osOriginalBtn');
const sel=document.getElementById('osLang');
const voice=document.getElementById('osVoiceBtn');
const state=document.getElementById('osState');
const originals=new WeakMap();
let enabled=false, observer=null;

const dict={
en:{'전체':'All','오늘':'Today','편집':'Edit','메일·오피스':'Mail · Office','검색·SNS':'Search · SNS','비즈니스':'Business','프로젝트':'Projects','오늘 바로 쓰기':'Quick access','전화':'Phone','문자':'Messages','연락처':'Contacts','카메라':'Camera','사진':'Photos','파일':'Files','알람':'Alarm','계산기':'Calculator','일정관리':'Schedule','검색 · 소통 · 이동':'Search · Social · Mobility','업무 · 비즈니스':'Work · Business','AUSOAI 프로젝트 · 시스템':'AUSOAI Projects · System','화면 번역':'Translate screen','원문':'Original'},
ja:{'전체':'すべて','오늘':'今日','편집':'編集','메일·오피스':'メール・オフィス','검색·SNS':'検索・SNS','비즈니스':'ビジネス','프로젝트':'プロジェクト','오늘 바로 쓰기':'すぐ使う','전화':'電話','문자':'メッセージ','연락처':'連絡先','카메라':'カメラ','사진':'写真','파일':'ファイル','알람':'アラーム','계산기':'電卓','일정관리':'予定管理','화면 번역':'画面翻訳','원문':'原文'},
'zh-CN':{'전체':'全部','오늘':'今天','편집':'编辑','메일·오피스':'邮件·办公','검색·SNS':'搜索·社交','비즈니스':'商务','프로젝트':'项目','오늘 바로 쓰기':'立即使用','전화':'电话','문자':'短信','연락처':'联系人','카메라':'相机','사진':'照片','파일':'文件','알람':'闹钟','계산기':'计算器','일정관리':'日程管理','화면 번역':'屏幕翻译','원문':'原文'},
vi:{'전체':'Tất cả','오늘':'Hôm nay','편집':'Chỉnh sửa','메일·오피스':'Mail · Office','검색·SNS':'Tìm kiếm · MXH','비즈니스':'Kinh doanh','프로젝트':'Dự án','전화':'Điện thoại','문자':'Tin nhắn','연락처':'Danh bạ','카메라':'Máy ảnh','사진':'Ảnh','파일':'Tệp','알람':'Báo thức','계산기':'Máy tính','일정관리':'Lịch','화면 번역':'Dịch màn hình','원문':'Bản gốc'},
th:{'전체':'ทั้งหมด','오늘':'วันนี้','편집':'แก้ไข','검색·SNS':'ค้นหา · โซเชียล','비즈니스':'ธุรกิจ','프로젝트':'โปรเจกต์','전화':'โทรศัพท์','문자':'ข้อความ','사진':'รูปภาพ','파일':'ไฟล์','화면 번역':'แปลหน้าจอ','원문':'ต้นฉบับ'},
ru:{'전체':'Все','오늘':'Сегодня','편집':'Редактор','검색·SNS':'Поиск · соцсети','비즈니스':'Бизнес','프로젝트':'Проекты','전화':'Телефон','문자':'Сообщения','사진':'Фото','파일':'Файлы','화면 번역':'Перевод экрана','원문':'Оригинал'},
hi:{'전체':'सभी','오늘':'आज','편집':'संपादन','비즈니스':'व्यवसाय','프로젝트':'प्रोजेक्ट','전화':'फ़ोन','문자':'संदेश','사진':'फ़ोटो','파일':'फ़ाइलें','화면 번역':'स्क्रीन अनुवाद','원문':'मूल'},
id:{'전체':'Semua','오늘':'Hari ini','편집':'Edit','비즈니스':'Bisnis','프로젝트':'Proyek','전화':'Telepon','문자':'Pesan','사진':'Foto','파일':'File','화면 번역':'Terjemahkan layar','원문':'Asli'},
fr:{'전체':'Tout','오늘':"Aujourd’hui",'편집':'Modifier','비즈니스':'Entreprise','프로젝트':'Projets','전화':'Téléphone','문자':'Messages','사진':'Photos','파일':'Fichiers','화면 번역':"Traduire l’écran",'원문':'Original'},
de:{'전체':'Alle','오늘':'Heute','편집':'Bearbeiten','비즈니스':'Business','프로젝트':'Projekte','전화':'Telefon','문자':'Nachrichten','사진':'Fotos','파일':'Dateien','화면 번역':'Bildschirm übersetzen','원문':'Original'},
it:{'전체':'Tutto','오늘':'Oggi','편집':'Modifica','비즈니스':'Business','프로젝트':'Progetti','전화':'Telefono','문자':'Messaggi','사진':'Foto','파일':'File','화면 번역':'Traduci schermo','원문':'Originale'},
es:{'전체':'Todo','오늘':'Hoy','편집':'Editar','비즈니스':'Negocios','프로젝트':'Proyectos','전화':'Teléfono','문자':'Mensajes','사진':'Fotos','파일':'Archivos','화면 번역':'Traducir pantalla','원문':'Original'}
};

function translateText(s,lang){
  const d=dict[lang]||{};
  const t=s.trim();
  if(d[t]) return s.replace(t,d[t]);
  return s;
}
function translateNode(root=document.body){
  if(!enabled) return;
  const lang=sel.value;
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{
    acceptNode(n){
      if(!n.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
      const p=n.parentElement;
      if(!p || ['SCRIPT','STYLE','TEXTAREA','INPUT','OPTION'].includes(p.tagName) || p.closest('#ausoOsBar')) return NodeFilter.FILTER_REJECT;
      return NodeFilter.FILTER_ACCEPT;
    }
  });
  const nodes=[]; while(w.nextNode()) nodes.push(w.currentNode);
  for(const n of nodes){
    if(!originals.has(n)) originals.set(n,n.nodeValue);
    const o=originals.get(n);
    n.nodeValue=translateText(o,lang);
  }
  document.documentElement.lang=lang;
}
function restore(){
  const w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);
  const nodes=[]; while(w.nextNode()) nodes.push(w.currentNode);
  for(const n of nodes) if(originals.has(n)) n.nodeValue=originals.get(n);
  document.documentElement.lang='ko';
}
function setEnabled(v){
  enabled=v;
  btn.classList.toggle('active',v);
  btn.textContent=v?'번역 ON':'화면 번역';
  if(v){translateNode(); state.textContent='번역 '+sel.value; startObserver();}
  else {restore(); stopObserver(); state.textContent='원문';}
}
function startObserver(){
  stopObserver();
  observer=new MutationObserver(ms=>{
    if(!enabled) return;
    for(const m of ms) for(const n of m.addedNodes) if(n.nodeType===1) translateNode(n);
  });
  observer.observe(document.getElementById('app'),{childList:true,subtree:true});
}
function stopObserver(){if(observer){observer.disconnect();observer=null;}}
function translatedExternal(url){
  if(!enabled || sel.value==='ko' || !/^https?:\/\//i.test(url)) return url;
  return 'https://translate.google.com/translate?sl=auto&tl='+encodeURIComponent(sel.value)+'&u='+encodeURIComponent(url);
}
document.addEventListener('click',e=>{
  const a=e.target.closest('a[href]');
  if(!a || a.closest('#ausoOsBar')) return;
  const href=a.getAttribute('href');
  if(href && /^https?:\/\//i.test(href) && enabled && sel.value!=='ko'){
    a.setAttribute('href',translatedExternal(href));
    state.textContent='외부 사이트 번역';
  }
},true);

btn.onclick=()=>setEnabled(!enabled);
orig.onclick=()=>setEnabled(false);
sel.onchange=()=>{
  try{localStorage.setItem(KEY,sel.value)}catch{}
  if(enabled){restore();translateNode();state.textContent='번역 '+sel.value;}
};
try{const saved=localStorage.getItem(KEY);if(saved&&[...sel.options].some(o=>o.value===saved))sel.value=saved}catch{}

voice.onclick=()=>{
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){state.textContent='이 브라우저 음성 미지원';return;}
  const r=new SR(); r.lang='ko-KR'; r.interimResults=false; r.maxAlternatives=1;
  voice.classList.add('active'); state.textContent='음성 듣는 중';
  r.onresult=e=>{
    const t=e.results[0][0].transcript||'';
    state.textContent=t;
    if(/원문|번역 끄|한국어/.test(t)){setEnabled(false);sel.value='ko';return;}
    const map=[['영어','en'],['일본어','ja'],['중국어','zh-CN'],['베트남어','vi'],['태국어','th'],['러시아어','ru'],['힌디어','hi'],['인도네시아어','id'],['프랑스어','fr'],['독일어','de'],['이탈리아어','it'],['스페인어','es']];
    const hit=map.find(x=>t.includes(x[0]));
    if(hit){sel.value=hit[1];setEnabled(true);}
    else if(t.includes('번역')) setEnabled(true);
  };
  r.onerror=()=>{state.textContent='음성 인식 오류';voice.classList.remove('active')};
  r.onend=()=>voice.classList.remove('active');
  try{r.start()}catch{state.textContent='마이크를 다시 눌러 주세요';voice.classList.remove('active')}
};
})();
</script></body></html>
