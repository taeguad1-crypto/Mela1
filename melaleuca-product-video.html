  <script>

      {label:'CATEGORY 3 · NUTRITION',title:'영양 카테고리<br>성분부터 확인',lead:'제품 유형과 섭취 대상, 원료·알레르기·섭취량을 공식 표시에서 확인한 뒤 선택합니다.',cards:[['제품 유형','건강기능식품·식품 구분'],['원료 확인','함량·알레르기 표시'],['섭취 안내','공식 1일 섭취량'],['전문 상담','복약·질환·임신 시 문의']],img:'assets/overview-presenter-3.webp',alt:'영양 카테고리를 안내하는 한국인 남성 모델',speech:'영양 제품은 제품 유형, 원료와 함량, 알레르기, 하루 섭취량을 공식 표시에서 확인하세요. 질환이 있거나 약을 복용 중이거나 임신 수유 중이면 의사나 약사와 상의하세요.',href:'https://kr.melaleuca.com/productstore',button:'공식 영양제품 확인',second:'melaleuca-ai.html',secondButton:'영양제품 질문'},
      {label:'CATEGORY 4 · PERSONAL CARE',title:'퍼스널케어<br>용도와 피부 상태',lead:'위생·바디·헤어·구강 제품은 사용 부위와 개인 민감도를 고려해 공식 사용법대로 사용합니다.',cards:[['바디·위생','사용 부위 확인'],['헤어','두피·모발 목적 확인'],['구강','연령·사용법 확인'],['피부 반응','이상 시 사용 중지']],img:'assets/overview-presenter-2.webp',alt:'퍼스널케어 카테고리를 안내하는 한국인 여성 모델',speech:'퍼스널 케어는 바디와 위생, 헤어, 구강 제품으로 나눕니다. 사용 부위와 연령, 주의사항을 확인하고 이상 반응이 있으면 사용을 중지하세요.',href:'https://kr.melaleuca.com/productstore',button:'공식 퍼스널케어 확인',second:'melaleuca-ai.html',secondButton:'퍼스널케어 질문'},
      {label:'CATEGORY 5 · BEAUTY',title:'뷰티·스킨케어<br>단계는 단순하게',lead:'세정·보습·자외선 등 필요한 단계만 고르고, 전성분과 피부 적합성은 공식 표시로 확인합니다.',cards:[['세정','제품 용도·사용 순서'],['보습','피부 타입 고려'],['선케어','표시된 사용법 확인'],['패치 확인','민감 피부는 소량 시험']],img:'assets/overview-presenter-3.webp',alt:'뷰티 카테고리를 안내하는 한국인 남성 모델',speech:'뷰티와 스킨케어는 세정, 보습, 자외선 관리 등 필요한 단계부터 단순하게 선택하세요. 전성분과 피부 적합성을 확인하고 민감한 피부는 좁은 부위에 먼저 시험합니다.',href:'https://kr.melaleuca.com/productstore',button:'공식 뷰티제품 확인',second:'melaleuca-ai.html',secondButton:'뷰티제품 질문'},
      {label:'CATEGORY 6 · ESSENTIAL OILS',title:'에센셜오일<br>안전이 먼저',lead:'향과 생활·피부 사용 정보만 안내하며, 섭취나 질병 치료로 오인될 설명은 하지 않습니다.',cards:[['라벨 우선','사용 부위·희석 확인'],['피해야 할 곳','눈·귓속·점막'],['주의 대상','어린이·임신·복약'],['과장 금지','치료·예방 표현 금지']],img:'assets/overview-presenter-1.webp',alt:'에센셜오일 안전 사용을 설명하는 한국인 남성 모델',speech:'에센셜 오일은 안전이 먼저입니다. 라벨의 사용 부위와 희석법을 따르고 눈, 귓속, 점막을 피하세요. 섭취를 권하거나 질병을 치료하고 예방한다고 설명하지 않습니다.',href:'melaleuca-oils.html',button:'오일 안전 안내',second:'melaleuca-oil-catalog.html',secondButton:'오일 제품 도감'}
    ];const el=id=>document.getElementById(id),stage=el('stage'),model=el('model'),cards=el('cards'),fill=el('fill'),play=el('play');let i=0,playing=true,voiceOn=false,start=performance.now(),elapsed=0;const duration=9500,voiceLead=['우리 집에 필요한 제품, 어디부터 볼까요?','먼저 생활용품입니다.','이번에는 영양 제품입니다.','매일 쓰는 퍼스널 케어를 살펴볼까요?','뷰티와 스킨케어는 단순하게 시작하세요.','마지막은 에센셜 오일입니다. 무엇보다 안전이 먼저예요.'];
      data.forEach((_,n)=>{const b=document.createElement('button');b.className='dot'+(n?'':' on');b.ariaLabel=`${n+1}번 카테고리`;b.onclick=()=>show(n,true);el('dots').append(b)});
      function speak(){if(!voiceOn)return;try{const message=voiceLead[i]+' '+data[i].speech;if(window.__SARANGBANG_SPEAK__)window.__SARANGBANG_SPEAK__(message,{mood:'warm'});else{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(message);u.lang='ko-KR';u.rate=.96;u.pitch=1.07;speechSynthesis.speak(u)}}catch(e){}}
      function paint(){const d=data[i];model.src=d.img;model.alt=d.alt;el('step').textContent=d.label;el('title').innerHTML=d.title;el('lead').textContent=d.lead;cards.innerHTML=d.cards.map(x=>`<article class="card"><b>${x[0]}</b><span>${x[1]}</span></article>`).join('');el('primary').href=d.href;el('primary').textContent=d.button;el('secondary').href=d.second;el('secondary').textContent=d.secondButton;el('third').hidden=!d.third;el('third').href=d.third||'#';el('third').textContent=d.thirdButton||'추가 영상';el('caption').textContent=`장면 ${i+1}. ${d.speech}`;el('info').textContent=`${i+1} / ${data.length} · ${d.label.split(' · ')[1]}`;[...el('dots').children].forEach((x,n)=>x.classList.toggle('on',n===i));stage.classList.add('changing');setTimeout(()=>stage.classList.remove('changing'),280)}
      function show(n,user=false){i=(n+data.length)%data.length;elapsed=0;start=performance.now();fill.style.width='0';paint();if(user||playing)speak()}
      function tick(t){if(playing){elapsed=t-start;fill.style.width=Math.min(100,elapsed/duration*100)+'%';if(elapsed>=duration)show(i+1)}requestAnimationFrame(tick)}
      el('prev').onclick=()=>show(i-1,true);el('next').onclick=()=>show(i+1,true);play.onclick=()=>{playing=!playing;play.textContent=playing?'일시정지':'재생';start=performance.now()-elapsed;if(playing)speak()};el('voice').onclick=e=>{voiceOn=!voiceOn;e.currentTarget.textContent=voiceOn?'🔊 생동감 해설 켜짐':'🔇 해설 꺼짐';if(voiceOn)speak();else window.__SARANGBANG_STOP_SPEAK__?window.__SARANGBANG_STOP_SPEAK__():speechSynthesis?.cancel()};window.__SARANGBANG_ROUTE_COMMAND__=text=>{const q=String(text||'').replace(/[\s·._-]+/g,'').toLowerCase();if(/다음/.test(q)){show(i+1,true);return true}if(/이전/.test(q)){show(i-1,true);return true}if(/음성|해설/.test(q)){el('voice').click();return true}if(/정지|멈춰/.test(q)){playing=false;play.textContent='재생';window.__SARANGBANG_STOP_SPEAK__?window.__SARANGBANG_STOP_SPEAK__():speechSynthesis?.cancel();return true}if(/재생|계속/.test(q)){playing=true;play.textContent='일시정지';start=performance.now()-elapsed;return true}const map=[[/전체|처음/,0],[/생활|세탁|청소|주방/,1],[/영양|건강기능|식품/,2],[/퍼스널|헤어|구강|바디/,3],[/뷰티|스킨|화장품/,4],[/오일|에센셜/,5]];for(const [rx,n] of map)if(rx.test(q)){show(n,true);return true}return false};paint();requestAnimationFrame(tick)})();
