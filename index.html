<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes,viewport-fit=cover"><title>멜라루카 사랑방</title><style>*{box-sizing:border-box}html{touch-action:pan-x pan-y pinch-zoom}body{margin:0;background:#f5fffb;color:#173d35;font-family:system-ui,'Noto Sans KR',sans-serif}a{text-decoration:none;color:inherit}.wrap{max-width:720px;margin:auto;padding:8px 10px 82px}.top{display:flex;justify-content:space-between;align-items:center}.top>img{width:112px;height:34px;object-fit:contain}.top select{font-size:10px;border:1px solid #cde8df;border-radius:10px;background:#fff;padding:5px}.profile{display:grid;grid-template-columns:76px 1fr;gap:10px;align-items:center;margin-top:5px;padding:9px;border:1px solid #cde8df;border-radius:17px;background:#fff}.avatar{position:relative;width:72px!important;height:72px!important;min-width:72px!important;max-width:72px!important;min-height:72px!important;max-height:72px!important;aspect-ratio:1/1!important;border-radius:9999px!important;overflow:hidden!important;background:#e8f8f3;border:2px solid #d4eee6}.avatar img{display:block;width:100%!important;height:100%!important;min-width:100%!important;min-height:100%!important;aspect-ratio:1/1!important;border-radius:9999px!important;object-fit:contain;background:#fff;padding:8px}.avatar.hasPhoto img{object-fit:cover;padding:0}.plus{position:absolute;right:0;bottom:0;z-index:3;width:24px;height:24px;border-radius:50%;border:2px solid #fff;background:#19ad91;color:#fff;font-size:18px;font-weight:900;display:grid;place-items:center}.profile input[type=text],.profile input[type=tel]{display:block;width:100%;border:0;border-bottom:1px solid #deeee9;padding:4px 2px;font-size:11px}.contact{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}.contact a,.contact button{border:0;border-radius:8px;background:#eaf8f4;color:#08705d;padding:6px 7px;font-size:9px;font-weight:800}.menu{display:grid;grid-template :flex;justify-content:space-between;align-items:center}.new{width:30px;height:30px;border:0;border-radius:50%;background:#1eb497;color:#fff;font-size:21px}.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.gallery img,.gallery video{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px}.post{width:100%;min-height:55px;margin-top:5px;border:1px solid #c8dfd8;border-radius:8px;padding:7px}.social button{flex:0 0 auto;border:1px solid #ddd;background:#fff;border-radius:50%;width:38px;height:38px;font-size:9px;font-weight:900}.links{display:grid;grid-template-columns:repeat(2,1fr);gap:5px}.links a{padding:8px;border-radius:8px;background:#eaf8f4;text-align:center;font-size:9px;font-weight:800}.bottom{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(3,1fr);gap:5px;padding:7px 10px calc(7px + env(safe-area-inset-bottom));background:#fffffff2;border-top:1px solid #cde8df}.bottom a,.bottom button{border:0;border-radius:9px;background:#eaf8f4;min-height:38px;display:grid;place-items:center;font-weight:800}</style></head><body><main class="wrap"><div class="top"><img src="melaleuca-logo.svg" alt="Melaleuca"><select><option>🇰🇷 한국어</option><option>🇺🇸 English</option><option>🇯🇵 日本語</option><option>🇨🇳 中文</option></select></div><section class="profile"><div id="avatar" class="avatar"><img id="faceImg" src="melaleuca-logo.svg" alt="회원 프로필"><label class="plus">+<input id="face" type="file" accept="image/*" hidden></label></div><div><input id="name" type="text" placeholder="이름"><input id="role" type="text" placeholder="직책 · 소개"><input id="phone" type="tel" placeholder="전화번호"><div class="contact"><a id="call">☎ 전화</a><a id="sms">✉ 문자</a><a href="melaleuca-kakao.html">카카오톡</a><a href="melaleuca-ai.html">AI상담</a><button id="save">저장</button></div></div></section><div class="menu"><a href="#promo"><span class="ico p">▣</span>홍보자료</a><label><span class="ico o">📷</span>사진찍기<input id="camera" type="file" accept="image/*" capture="environment" hidden></label><label><span class="ico b">▧</span>갤러리<input id="galleryInput" type="file" accept="image/*,video/*" multiple hidden></label><a href="melaleuca-customers.html"><span class="ico g">👥</span>고객관리</a><a href="member-home.html"><span class="ico v">⚙</span>개인관리</a></div><section class="hero"><div><img src="melaleuca-logo.svg"><h1>멜라루카 사랑방</h1><p>제품 · 회사 · 회원 · 공식자료를 한곳에서</p></div></section><section class="voice"><div id="userLine" class="line">고객: 질문을 말하거나 입력해 주세요.</div><div id="aiLine" class="line ai">AI: 멜라루카 사랑방에 오신 것을 환영합니다. 무엇을 도와드릴까요?</div><div class="composer"><button onclick="voiceQuestion()">🎙</button><input id="q" placeholder="문자 질문"><button onclick="ask()">전송</button></div></section><section class="section"><h2>제품 전체 검색 · 가로 선택</h2><div class="search"><button onclick="voiceSearch()">🎙</button><input id="productSearch" placeholder="제품명·제품군"><button onclick="productGo()">검색</button></div><div class="cats"><button onclick="filterCat('전체')">전체</button><button onclick="filterCat('스킨')">스킨</button><button onclick="filterCat('오일')">오일</button></div><div class="rail" id="productRail"><a class="card" data-cat="스킨" href="melaleuca-renew-video.html"><img src="melaleuca-renew.png"><span>리뉴</span></a><a class="card" data-cat="오일" href="melaleuca-oils.html"><img src="official-essential-4pack.png"><span>에센셜오일</span></a><a class="card" data-cat="오일" href="melaleuca-oil-catalog.html"><img src="official-lavender.png"><span>라벤더</span></a><a class="card" data-cat="오일" href="melaleuca-oil-catalog.html"><img src="official-frankincense.png"><span>프랑킨센스</span></a></div></section><section class="section"><h2>공식자료 사진</h2><div class="materials"><a href="melaleuca-overview.html"><img src="assets/overview-pdf-1.png"></a><a href="melaleuca-overview.html"><img src="assets/overview-pdf-2.png"></a><a href="melaleuca-overview.html"><img src="assets/overview-pdf-10.png"></a><a href="melaleuca-overview.html"><img src="assets/overview-pdf-11.png"></a></div></section><section class="section" id="promo"><div class="head"><h2>내 홍보자료 · SNS</h2><label class="new">+<input id="postUpload" type="file" accept="image/*,video/*" multiple hidden></label></div><div id="gallery" class="gallery"></div><textarea id="post" class="post" placeholder="홍보글 입력"></textarea><div class="contact"><button onclick="dictatePost()">🎙 음성작성</button><button onclick="sharePromo()">공유·내보내기</button></div><div class="social"><button onclick="sharePromo()">Kakao</button><button onclick="sharePromo()">IG</button><button onclick="sharePromo()">FB</button><button onclick="sharePromo()">YT</button><button onclick="sharePromo()">TikTok</button><button onclick="smsPromo()">SMS</button></div></section><section class="section"><h2>기존 자료</h2><div class="links"><a href="melaleuca-overview.html">기존 오버뷰</a><a href="melaleuca-ai.html">AI 고객센터</a><a href="melaleuca-customers.html">고객관리</a><a href="melaleuca-product-video.html">제품 영상</a><a href="https://kr.melaleuca.com/" target="_blank" rel="noopener">공식 사이트·로그인</a></div></section></main><nav class="bottom"><button onclick="history.back()">← 이전</button><a href="index.html">⌂ 홈</a><button onclick="history.forward()">다음 →</button></nav><script>const $=s=>document.querySelector(s),K='mela_profile';function load(){let d={};try{d=JSON.parse(localStorage.getItem(K)||'{}')}catch{};['name','role','phone'].forEach(k=>$('#'+k).value=d[k]||'');if(d.face){$('#faceImg').src=d.face;$('#avatar').classList.add('hasPhoto')}links()}function links(){let p=$('#phone').value.trim();$('#call').href=p?'tel:'+p:'#';$('#sms').href=p?'sms:'+p:'#'}function save(){localStorage.setItem(K,JSON.stringify({name:$('#name').value,role:$('#role').value,phone:$('#phone').value,face:$('#avatar').classList.contains('hasPhoto')?$('#faceImg').src:''}));links()}function media(f,profile){if(!f)return;let r=new FileReader;r.onload=()=>{if(profile){$('#faceImg').src=r.result;$('#avatar').classList.add('hasPhoto');save()}else{let e=f.type.startsWith('video')?document.createElement('video'):document.createElement('img');e.src=r.result;if(e.tagName==='VIDEO')e.controls=true;$('#gallery').prepend(e)}};r.readAsDataURL(f)}$('#face').onchange=e=>media(e.target.files[0],true);$('#camera').onchange=e=>media(e.target.files[0],false);$('#galleryInput').onchange=e=>[...e.target.files].forEach(f=>media(f,false));$('#postUpload').onchange=e=>[...e.target.files].forEach(f=>media(f,false));$('#save').onclick=save;function speak(t){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='ko-KR';speechSynthesis.speak(u)}function answer(q){if(/제품|로션|오일|샴푸/.test(q))return '제품 검색과 공식 제품자료에서 확인하실 수 있습니다.';if(/회사/.test(q))return '회사 정보는 기존 오버뷰 공식자료에서 확인하실 수 있습니다.';if(/가입|회원/.test(q))return '회원 관련 정보는 공식 안내와 로그인 페이지에서 확인해 주세요.';return '질문을 확인했습니다. 자세한 상담은 AI 고객센터에서도 이어갈 수 있습니다.'}function ask(t){let q=(t||$('#q').value).trim();if(!q)return;let a=answer(q);$('#userLine').textContent='고객: '+q;$('#aiLine').textContent='AI: '+a;speak(a);$('#q').value=''}function rec(cb){let R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R)return alert('음성인식을 지원하지 않습니다.');let r=new R;r.lang='ko-KR';r.onresult=e=>cb(e.results[0][0].transcript);r.start()}function voiceQuestion(){rec(ask)}function voiceSearch(){rec(t=>{$('#productSearch').value=t;productGo()})}function productGo(){let q=$('#productSearch').value.toLowerCase();document.querySelectorAll('.card').forEach(c=>c.style.display=!q||c.textContent.toLowerCase().includes(q)?'':'none')}function filterCat(c){document.querySelectorAll('.card').forEach(x=>x.style.display=c==='전체'||x.dataset.cat.includes(c)?'':'none')}function dictatePost(){rec(t=>$('#post').value=t)}async function sharePromo(){let text=$('#post').value||'멜라루카 사랑방';if(navigator.share)await navigator.share({title:'멜라루카 사랑방',text,url:location.href});else navigator.clipboard?.writeText(text+' '+location.href)}function smsPromo(){location.href='sms:?body='+encodeURIComponent(($('#post').value||'멜라루카 사랑방')+' '+location.href)}load();</script></body><
