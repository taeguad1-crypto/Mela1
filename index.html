-kakao.html">💬 카톡</a><a href="melaleuca-ai.html">AI 상담</a><a href="member-home.html">개인관리</a><button id="save">저장</button></div></div></section><div class="stats"><div class="stat"><b>♡</b>좋아요</div><div class="stat"><b>💬</b>댓글</div><div class="stat"><b>🔔</b>알림</div><a class="stat" href="melaleuca-customers.html"><b>👥</b>고객관리</a><a class="stat" href="#promo"><b>↗</b>홍보</a></div><section class="hero"><img src="melaleuca-logo.svg" alt="Melaleuca"><h1>멜라루카 사랑방</h1><p>제품 · 회사 · 회원가입 · 보상 · 비즈니스 정보를 한곳에서 확인하세요.</p></section><div class="quick"><a href="melaleuca-guide.html">회원가입</a><a href="melaleuca-overview.html">회사정보</a><a href="melaleuca-compensation.html">보상플랜</a><a href="melaleuca-business.html">비즈니스</a><a href="melaleuca-videos.html">영상자료</a></div><section class="voicebox"><div class="chat" id="chat">멜라루카 사랑방에 오신 것을 환영합니다. 제품 정보, 회사 정보, 회원가입과 보상 정보를 안내해 드립니다. 무엇을 도와드릴까요?</div><div class="composer"><button onclick="listen()">🎙</button><input id="q" placeholder="질문을 말하거나 입력하세요"><button onclick="ask()">전송</button></div></section><section class="section"><h2>멜라루카 공식 제품 이미지</h2><div class="products"><a href="melaleuca-renew-video.html"><img src="melaleuca-renew.png" alt="Renew"></a><a href="melaleuca-oils.html"><img src="official-essential-4pack.png" alt="Essential oils"></a><a href="melaleuca-oil-catalog.html"><img src="official-lavender.png" alt="Lavender"></a><a href="melaleuca-oil-catalog.html"><img src="official-frankincense.png" alt="Frankincense"></a><a href="melaleuca-oils.html"><img src="assets/official-store-shots/oils-01.jpg" alt="공식 제품"></a><a href="melaleuca-oils.html"><img src="assets/official-store-shots/oils-02.jpg" alt="공식 제품"></a></div></section><section class="section" id="promo"><h2>내 홍보 · SNS</h2><div class="mini"><label class="pick">📷 사진찍기<input id="camera" type="file" accept="image/*" capture="environment" hidden></label><label class="pick">🖼 갤러리<input id="galleryInput" type="file" accept="image/*" multiple hidden></label><button onclick="dictatePost()">🎙 음성작성</button></div><div id="gallery" class="gallery"></div><textarea id="post" class="promo" placeholder="고객에게 보낼 홍보글을 입력하세요"></textarea><div class="social"><button class="ka" onclick="sharePromo()">K</button><button class="ig" onclick="sharePromo()">◎</button><button class="fb" onclick="sharePromo()">f</button><button class="yt" onclick="sharePromo()">▶</button><button class="tt" onclick="sharePromo()">♪</button><button class="sms" onclick="smsPromo()">SMS</button></div><div class="mini"><button onclick="sharePromo()">공유·내보내기</button><button onclick="window.print()">PDF/인쇄</button><button onclick="navigator.clipboard?.writeText(location.href)">링크복사</button></div></section><section class="section"><h2>기존 Mela1 자료</h2><div class="links"><a href="melaleuca-ai.html">AI 고객센터</a><a href="melaleuca-customers.html">개인 고객관리</a><a href="melaleuca-product-video.html">제품 영상</a><a href="melaleuca-recommend.html">추천 제품</a><a href="melaleuca-rooms.html">회원 혜택</a><a href="melaleuca-more.html">추가 정보</a><a href="melaleuca-card.html">명함·홍보</a><a href="melaleuca-subscription.html">구독 관리</a></div></section></main><nav class="bottom"><button onclick="history.back()">← 이전</button><a href="index.html">⌂ 홈</a><button onclick="history.forward()">다음 →</button></nav><script src="melaleuca-web-voice.js"></script><script>const $=s=>document.querySelector(s),K='mela_home_profile';function speak(t){window.__SARANGBANG_SPEAK__?window.__SARANGBANG_SPEAK__(t,{mood:'guide'}):speechSynthesis.speak(new SpeechSynthesisUtterance(t))}function load(){let d={};try{d=JSON.parse(localStorage.getItem(K)||'{}')}catch{};['name','role','phone'].forEach(k=>$('#'+k).value=d[k]||'');if(d.face)$('#faceImg').src=d.face;links()}function links(){let p=$('#phone').value.trim();$('#call').href=p?'tel:'+p:'#';$('#smsLink').href=p?'sms:'+p:'#'}function file(f,target){if(!f)return;let r=new FileReader;r.onload=()=>{if(target){$('#faceImg').src=r.result}else{let i=new Image;i.src=r.result;$('#gallery').append(i)}};r.readAsDataURL(f)}$('#face').onchange=e=>file(e.target.files[0],1);$('#camera').onchange=e=>file(e.target.files[0]);$('#galleryInput').onchange=e=>[...e.target.files].forEach(f=>file(f));$('#save').onclick=()=>{localStorage.setItem(K,JSON.stringify({name:$('#name').value,role:$('#role').value,phone:$('#phone').value,face:$('#faceImg').src||''}));links();alert('내 정보를 저장했습니다.')};function listen(){if(window.__SARANGBANG_LISTEN__)window.__SARANGBANG_LISTEN__();else alert('마이크를 사용할 수 없습니다.')}function ask(){let q=$('#q').value.trim();if(!q)return;let a=/제품/.test(q)?'제품 안내를 열어드릴 수 있습니다. 아래 공식 제품 이미지와 제품 영상 자료를 확인해 주세요.':/보상/.test(q)?'보상플랜은 보상 안내 화면에서 최신 조건과 함께 확인해 주세요.':/회사/.test(q)?'회사 정보는 공식자료 오버뷰에서 확인할 수 있습니다.':/가입|회원/.test(q)?'회원가입 안내방에서 가입 절차와 조건을 확인할 수 있습니다.':'일반 질문은 AI 상담실에서 이어서 자세히 상담할 수 있습니다.';$('#chat').innerHTML+='<br><b>고객:</b> '+q.replace(/[<>]/g,'')+'<br><b>AI:</b> '+a;speak(a);$('#q').value=''}function dictatePost(){let R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R)return alert('음성입력을 지원하지 않습니다.');let r=new R;r.lang='ko-KR';r.onresult=e=>$('#post').value=e.results[0][0].transcript;r.start()}async function sharePromo(){let text=$('#post').value||'멜라루카 사랑방';if(navigator.share)await navigator.share({title:'멜라루카 사랑방',text,url:location.href});else navigator.clipboard?.writeText(text+' '+location.href)}function smsPromo(){location.href='sms:?body='+encodeURIComponent(($('#post').value||'멜라루카 사랑방')+' '+location.href)}load();setTimeout(()=>speak('멜라루카 사랑방에 오신 것을 환영합니다. 제품 정보, 회사 정보, 회원가입과 보상 정보를 안내해 드립니다. 무엇을 도와드릴까요?'),900);</script></body></html>
