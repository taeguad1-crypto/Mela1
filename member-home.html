<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Mela1 개인 AI 홈페이지</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,'Noto Sans KR',sans-serif;background:#eef9f5;color:#173d35}.top{position:sticky;top:0;z-index:9;padding:9px;background:#fffffff2;border-bottom:1px solid #c9e3da}.bar{display:flex;gap:6px;overflow:auto}.bar a,.bar button,.bar select{flex:0 0 auto;border:0;border-radius:10px;padding:9px;background:#e2f4ee;color:#075c4c;text-decoration:none;font-size:11px;font-weight:800}.wrap{max-width:820px;margin:auto;padding:13px 13px 90px}.profile{display:grid;grid-template-columns:92px 1fr;gap:12px;padding:15px;border-radius:23px;background:linear-gradient(135deg,#08745e,#0ba785);color:white}.avatar{width:92px;height:92px;border-radius:50%;object-fit:cover;background:#d9f3ea;border:3px solid white}.profile input{width:100%;padding:8px;margin:3px 0;border:0;border-radius:9px}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}.actions a,.actions button,.pick{border:0;border-radius:10px;padding:9px 11px;background:white;color:#08604f;text-decoration:none;font-size:12px;font-weight:800}.card{margin-top:11px;padding:14px;border:1px solid #c9e3da;border-radius:19px;background:white}.card h2{margin:0 0 8px;font-size:17px}.search{display:grid;grid-template-columns:1fr auto auto;gap:6px}.search input,.chatinput{min-width:0;padding:11px;border:1px solid #bad9cf;border-radius:11px}.search button,.voice{border:0;border-radius:11px;padding:10px;background:#08745e;color:white;font-weight:800}.chat{min-height:120px;max-height:260px;overflow:auto;padding:10px;border-radius:13px;background:#f0faf6;font-size:13px;line-height:1.55}.composer{display:grid;grid-template-columns:44px 1fr 58px;gap:6px;margin-top:7px}.promo{width:100%;min-height:90px;padding:10px;border:1px solid #bad9cf;border-radius:11px}.previews{display:flex;gap:7px;overflow:auto;margin:8px 0}.previews img{width:100px;height:100px;object-fit:cover;border-radius:11px}.bottom{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(3,1fr);gap:7px;padding:8px 13px calc(8px + env(safe-area-inset-bottom));background:#fffffff2;border-top:1px solid #c9e3da}.bottom a,.bottom button{min-height:42px;border:0;border-radius:11px;background:#e1f3ed;color:#075c4c;text-decoration:none;display:grid;place-items:center;font-weight:800}</style></head><body><header class="top"><div class="bar"><a href="#profile">내 프로필</a><a href="melaleuca-ai.html">AI 상담실</a><a href="melaleuca-customers.html">고객관리</a><a href="#promo">홍보/SNS</a><a href="#studio">제작·내보내기</a><select id="lang" aria-label="언어"><option value="ko-KR">🇰🇷 한국어</option><option value="en-US">🇺🇸 English</option><option value="ja-JP">🇯🇵 日本語</option><option value="zh-CN">🇨🇳 中文</option><option value="zh-TW">🇹🇼 繁體中文</option><option value="vi-VN">🇻🇳 Tiếng Việt</option><option value="th-TH">🇹🇭 ไทย</option><option value="id-ID">🇮🇩 Indonesia</option><option value="hi-IN">🇮🇳 हिन्दी</option><option value="ru-RU">🇷🇺 Русский</option><option value="it-IT">🇮🇹 Italiano</option><option value="fr-FR">🇫🇷 Français</option><option value="de-DE">🇩🇪 Deutsch</option><option value="ms-MY">🇲🇾 Melayu</option><option value="mn-MN">🇲🇳 Монгол</option><option value="lo-LA">🇱🇦 ລາວ</option><option value="es-ES">🇪🇸 Español</option><option value="pt-BR">🇧🇷 Português</option><option value="ar-SA">🇸🇦 العربية</option><option value="fil-PH">🇵🇭 Filipino</option></select></div></header><main class="wrap"><section class="profile" id="profile"><div><img id="avatar" class="avatar" alt="프로필"><label class="pick">📷 얼굴사진<input id="face" type="file" accept="image/*" capture="user" hidden></label></div><div><input id="name" placeholder="이름"><input id="role" placeholder="직책 · 소개"><input id="phone" inputmode="tel" placeholder="전화번호"><input id="kakao" placeholder="카카오톡/채널 링크"><div class="actions"><a id="call">전화</a><a id="sms">문자</a><a id="katalk">카톡</a><button id="save">저장</button></div></div></section><section class="card"><h2>🔎 네이버 · Google 음성검색</h2><div class="search"><input id="searchq" placeholder="검색어를 말하거나 입력"><button onclick="searchGo('naver')">네이버</button><button onclick="searchGo('google')">Google</button></div><div class="actions"><button onclick="listen('searchq')">🎙 검색 말하기</button></div></section><section class="card"><h2>🤖 문자 · 음성 AI 상담</h2><div class="chat" id="chat">멜라루카 고객님, 무엇을 도와드릴까요? 제품 안내, 회원가입, 비즈니스 안내 또는 일반 질문을 말씀해 주세요.</div><div class="composer"><button class="voice" onclick="listen('q')">🎙</button><input class="chatinput" id="q" placeholder="질문을 입력하세요"><button class="voice" onclick="ask()">전송</button></div></section><section class="card" id="promo"><h2>📣 내 홍보 · SNS</h2><div class="actions"><label class="pick">📷 사진찍기<input id="camera" type="file" accept="image/*" capture="environment" hidden></label><label class="pick">🖼 업로드<input id="gallery" type="file" accept="image/*" multiple hidden></label></div><div id="previews" class="previews"></div><textarea id="post" class="promo" placeholder="홍보글을 글 또는 음성으로 작성하세요"></textarea><div class="actions"><button onclick="listen('post')">🎙 글 말하기</button><button onclick="shareText()">공유/내보내기</button><button onclick="navigator.clipboard?.writeText(document.querySelector('#post').value)">복사</button></div></section><section class="card" id="studio"><h2>✨ 개인 홈페이지 홍보</h2><p>내 프로필·홍보자료·AI 상담실을 한 주소로 고객에게 공유합니다.</p><div class="actions"><button onclick="sharePage()">내 홈페이지 공유</button><button onclick="window.print()">PDF/인쇄</button></div></section></main><nav class="bottom"><button onclick="history.back()">← 이전</button><a href="index.html">⌂ 홈</a><button onclick="history.forward()">다음 →</button></nav><script>const $=s=>document.querySelector(s),K='mela_member_v2';function speak(t){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang=$('#lang').value;speechSynthesis.speak(u)}function load(){let d={};try{d=JSON.parse(localStorage.getItem(K)||'{}')}catch{};['name','role','phone','kakao'].forEach(k=>$('#'+k).value=d[k]||'');if(d.avatar)$('#avatar').src=d.avatar;links()}function links(){let p=$('#phone').value.trim(),k=$('#kakao').value.trim();$('#call').href=p?'tel:'+p:'#';$('#sms').href=p?'sms:'+p:'#';$('#katalk').href=k||'#'}$('#save').onclick=()=>{localStorage.setItem(K,JSON.stringify({name:$('#name').value,role:$('#role').value,phone:$('#phone').value,kakao:$('#kakao').value,avatar:$('#avatar').src||''}));links();alert('프로필을 이 기기에 저장했습니다.')};function fileImg(f,target){if(!f)return;let r=new FileReader;r.onload=()=>{if(target)$('#avatar').src=r.result;else{let i=new Image;i.src=r.result;$('#previews').append(i)}};r.readAsDataURL(f)}$('#face').onchange=e=>fileImg(e.target.files[0],1);$('#camera').onchange=e=>fileImg(e.target.files[0]);$('#gallery').onchange=e=>[...e.target.files].forEach(fileImg);function listen(id){let R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){alert('이 브라우저의 음성인식을 사용할 수 없습니다.');return}let r=new R;r.lang=$('#lang').value;r.interimResults=false;r.onresult=e=>{$('#'+id).value=e.results[0][0].transcript;if(id==='q')ask()};r.start()}function ask(){let q=$('#q').value.trim();if(!q)return;let a=/제품/.test(q)?'제품 안내를 도와드리겠습니다. 제품 카테고리와 공식 자료를 확인할 수 있습니다.':/회원|가입/.test(q)?'회원가입 안내를 도와드리겠습니다. 가입 조건과 절차를 확인해 주세요.':/비즈니스|사업/.test(q)?'비즈니스 안내를 도와드리겠습니다. 사업 연결과 보상 안내 화면으로 이동할 수 있습니다.':'질문을 확인했습니다. 일반 질문은 AI 상담실에서 계속 상담할 수 있습니다.';$('#chat').innerHTML+='<p><b>고객:</b> '+q.replace(/[<>]/g,'')+'</p><p><b>AI:</b> '+a+'</p>';speak(a);$('#q').value=''}function searchGo(w){let q=$('#searchq').value.trim();if(!q)return;location.href=w==='naver'?'https://search.naver.com/search.naver?query='+encodeURIComponent(q):'https://www.google.com/search?q='+encodeURIComponent(q)}async function shareText(){let t=$('#post').value;if(navigator.share)await navigator.share({title:'내 홍보',text:t,url:location.href});else navigator.clipboard?.writeText(t+' '+location.href)}async function sharePage(){if(navigator.share)await navigator.share({title:'내 Mela1 홈페이지',url:location.href});else navigator.clipboard?.writeText(location.href)}$('#lang').onchange=()=>{localStorage.setItem('mela_lang',$('#lang').value);speak('언어 설정이 변경되었습니다.')};load();let l=localStorage.getItem('mela_lang');if(l)$('#lang').value=l;setTimeout(()=>speak('멜라루카 고객님, 무엇을 도와드릴까요? 제품 안내, 회원가입, 비즈니스 안내 또는 일반 질문을 말씀해 주세요.'),600);</script></body></html>
