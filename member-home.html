<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Mela1 개인 홍보센터</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,'Noto Sans KR',sans-serif;background:#eef9f5;color:#173d35}.top{position:sticky;top:0;z-index:9;padding:8px;background:#fffffff2;border-bottom:1px solid #c9e3da}.bar{display:flex;gap:6px;overflow:auto}.bar a,.bar select{flex:0 0 auto;border:0;border-radius:10px;padding:8px;background:#e2f4ee;color:#075c4c;text-decoration:none;font-size:11px;font-weight:800}.wrap{max-width:820px;margin:auto;padding:10px 12px 90px}.profile{display:grid;grid-template-columns:78px 1fr;gap:10px;padding:12px;border-radius:21px;background:linear-gradient(135deg,#08745e,#0ba785);color:#fff}.avatar{width:76px;height:76px;border-radius:50%;object-fit:cover;background:#d9f3ea;border:3px solid #fff}.profile input{width:100%;padding:7px;margin:2px 0;border:0;border-radius:9px}.actions,.social{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}.actions a,.actions button,.pick,.social button{border:0;border-radius:10px;padding:8px 10px;background:#fff;color:#08604f;text-decoration:none;font-size:11px;font-weight:800}.card{margin-top:10px;padding:13px;border:1px solid #c9e3da;border-radius:19px;background:#fff}.card h2{margin:0 0 7px;font-size:17px}.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.gallery img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:12px;background:#edf6f2}.promo{width:100%;min-height:80px;padding:10px;border:1px solid #bad9cf;border-radius:11px}.chat{min-height:105px;max-height:240px;overflow:auto;padding:10px;border-radius:13px;background:#f0faf6;font-size:13px}.composer{display:grid;grid-template-columns:42px 1fr 55px;gap:6px;margin-top:7px}.composer input{min-width:0;padding:10px;border:1px solid #bad9cf;border-radius:11px}.voice{border:0;border-radius:11px;background:#08745e;color:#fff;font-weight:800}.brand{width:38px;height:38px;border-radius:50%!important;padding:0!important;display:grid;place-items:center!important;font-size:9px!important;font-weight:900!important}.kakao{background:#fee500!important;color:#181600!important}.instagram{background:linear-gradient(135deg,#833ab4,#fd1d1d,#fcb045)!important;color:#fff!important}.facebook{background:#1877f2!important;color:#fff!important}.youtube{background:#ff0000!important;color:#fff!important}.tiktok{background:#111!important;color:#fff!important}.sms{background:#49a879!important;color:#fff!important}.feed{margin-top:9px;border:1px solid #d6e8e2;border-radius:16px;overflow:hidden}.feedhead{display:flex;align-items:center;gap:8px;padding:9px}.mini{width:34px;height:34px;border-radius:50%;object-fit:cover;background:#def1ea}.feedimg{width:100%;max-height:430px;object-fit:cover;background:#eef7f4}.react{display:flex;gap:12px;padding:9px;font-size:13px}.bottom{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(3,1fr);gap:7px;padding:8px 13px calc(8px + env(safe-area-inset-bottom));background:#fffffff2;border-top:1px solid #c9e3da}.bottom a,.bottom button{min-height:42px;border:0;border-radius:11px;background:#e1f3ed;color:#075c4c;text-decoration:none;display:grid;place-items:center;font-weight:800}</style></head><body><header class="top"><div class="bar"><a href="#profile">내 프로필</a><a href="melaleuca-ai.html">AI 상담실</a><a href="melaleuca-customers.html">고객관리</a><a href="#promo">홍보/SNS</a><select id="lang"><option value="ko-KR">🇰🇷 한국어</option><option value="en-US">🇺🇸 English</option><option value="ja-JP">🇯🇵 日本語</option><option value="zh-CN">🇨🇳 中文</option><option value="zh-TW">🇹🇼 繁體</option><option value="vi-VN">🇻🇳 Việt</option><option value="th-TH">🇹🇭 ไทย</option><option value="id-ID">🇮🇩 Indonesia</option><option value="hi-IN">🇮🇳 हिन्दी</option><option value="ru-RU">🇷🇺 Русский</option><option value="it-IT">🇮🇹 Italiano</option><option value="fr-FR">🇫🇷 Français</option><option value="de-DE">🇩🇪 Deutsch</option><option value="ms-MY">🇲🇾 Melayu</option><option value="mn-MN">🇲🇳 Монгол</option><option value="lo-LA">🇱🇦 ລາວ</option><option value="es-ES">🇪🇸 Español</option><option value="pt-BR">🇧🇷 Português</option><option value="ar-SA">🇸🇦 العربية</option><option value="fil-PH">🇵🇭 Filipino</option></select></div></header><main class="wrap"><section class="profile" id="profile"><div><img id="avatar" class="avatar" alt="본인 얼굴"><label class="pick">📷 사진<input id="face" type="file" accept="image/*" capture="user" hidden></label></div><div><input id="name" placeholder="이름"><input id="role" placeholder="직책 · 소개"><input id="phone" inputmode="tel" placeholder="전화번호"><input id="kakao" placeholder="카카오톡/채널 링크"><div class="actions"><a id="call">전화</a><a id="sms">문자</a><a id="katalk">카톡</a><button id="save">저장</button></div></div></section><section class="card"><h2>🤖 음성 · 문자 AI 상담</h2><div class="chat" id="chat">멜라루카 사랑방에 오신 것을 환영합니다. 제품 정보, 회사 정보, 회원가입과 보상 정보를 안내해 드립니다. 무엇을 도와드릴까요?</div><div class="composer"><button class="voice" onclick="listen('q')">🎙</button><input id="q" placeholder="질문을 말하거나 입력하세요"><button class="voice" onclick="ask()">전송</button></div></section><section class="card" id="promo"><h2>📣 내 홍보방 · 사진 피드</h2><div class="actions"><label class="pick">📷 사진찍기<input id="camera" type="file" accept="image/*" capture="environment" hidden></label><label class="pick">🖼 갤러리 업로드<input id="galleryInput" type="file" accept="image/*" multiple hidden></label></div><div class="gallery" id="gallery"></div><textarea id="post" class="promo" placeholder="고객에게 보여줄 홍보글을 글 또는 음성으로 작성하세요"></textarea><div class="actions"><button onclick="listen('post')">🎙 음성작성</button><button onclick="makePost()">피드에 올리기</button><button onclick="sharePromo()">내보내기</button></div><div id="feed"></div></section><section class="card"><h2>🌐 SNS 로고 공유 · 내보내기</h2><div class="social"><button class="brand kakao" onclick="sharePromo()">Kakao</button><button class="brand instagram" onclick="sharePromo()">IG</button><button class="brand facebook" onclick="sharePromo()">f</button><button class="brand youtube" onclick="sharePromo()">▶</button><button class="brand tiktok" onclick="sharePromo()">♪</button><button class="brand sms" onclick="smsShare()">SMS</button><button onclick="window.print()">PDF</button><button onclick="copyPage()">링크</button></div><p style="font-size:11px;color:#617b73">각 서비스의 실제 게시 방식은 휴대폰 공유창과 설치된 앱을 사용합니다.</p></section><section class="card"><h2>🌿 멜라루카 제품 · 기존 자료</h2><p style="font-size:12px">가상 제품 이미지를 생성하지 않고 Mela1에 등록된 멜라루카 자료와 회원이 직접 올린 실제 제품 사진을 사용합니다.</p><div class="gallery"><a href="melaleuca-recommend.html"><img src="assets/overview-video-4.webp" alt="멜라루카 기존 자료"></a><a href="melaleuca-product-video.html"><img src="assets/overview-video-4.webp" alt="제품 영상 자료"></a><a href="melaleuca-overview.html"><img src="assets/overview-video-4.webp" alt="공식자료 오버뷰"></a></div></section></main><nav class="bottom"><button onclick="history.back()">← 이전</button><a href="index.html">⌂ 홈</a><button onclick="history.forward()">다음 →</button></nav><script>const $=s=>document.querySelector(s),K='mela_member_v3';let imgs=[];function speak(t){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang=$('#lang').value;speechSynthesis.speak(u)}function links(){let p=$('#phone').value.trim(),k=$('#kakao').value.trim();$('#call').href=p?'tel:'+p:'#';$('#sms').href=p?'sms:'+p:'#';$('#katalk').href=k||'#'}function load(){let d={};try{d=JSON.parse(localStorage.getItem(K)||'{}')}catch{};['name','role','phone','kakao'].forEach(k=>$('#'+k).value=d[k]||'');if(d.avatar)$('#avatar').src=d.avatar;links()}function readFile(f,avatar=false){if(!f)return;let r=new FileReader;r.onload=()=>{if(avatar)$('#avatar').src=r.result;else{imgs.push(r.result);renderGallery()}};r.readAsDataURL(f)}function renderGallery(){$('#gallery').innerHTML='';imgs.forEach(src=>{let i=new Image;i.src=src;$('#gallery').append(i)})}$('#face').onchange=e=>readFile(e.target.files[0],true);$('#camera').onchange=e=>readFile(e.target.files[0]);$('#galleryInput').onchange=e=>[...e.target.files].forEach(f=>readFile(f));$('#save').onclick=()=>{localStorage.setItem(K,JSON.stringify({name:$('#name').value,role:$('#role').value,phone:$('#phone').value,kakao:$('#kakao').value,avatar:$('#avatar').src||''}));links();alert('내 프로필을 저장했습니다.')};function listen(id){let R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){alert('이 브라우저에서는 음성인식을 지원하지 않습니다.');return}let r=new R;r.lang=$('#lang').value;r.onresult=e=>{$('#'+id).value=e.results[0][0].transcript;if(id==='q')ask()};r.start()}function ask(){let q=$('#q').value.trim();if(!q)return;let a=/보상/.test(q)?'보상 정보는 최신 공식 보상 자료와 자격 조건을 함께 확인해 주세요.':/제품/.test(q)?'제품 정보는 멜라루카 제품 자료와 제품 안내 화면에서 확인할 수 있습니다.':/회사/.test(q)?'회사 정보는 Mela1의 공식자료 오버뷰와 회사 안내에서 확인할 수 있습니다.':/회원|가입/.test(q)?'회원가입 절차와 조건을 안내해 드리겠습니다. 회원가입 안내방에서 자세히 확인할 수 있습니다.':'질문을 확인했습니다. 더 자세한 일반 질문은 AI 상담실에서 이어서 상담할 수 있습니다.';$('#chat').innerHTML+='<p><b>고객:</b> '+q.replace(/[<>]/g,'')+'</p><p><b>AI:</b> '+a+'</p>';speak(a);$('#q').value=''}function makePost(){let t=$('#post').value.trim();if(!t&&!imgs.length)return;let d=document.createElement('article');d.className='feed';let src=imgs[imgs.length-1]||'';d.innerHTML='<div class="feedhead"><img class="mini" src="'+($('#avatar').src||'')+'"><b>'+($('#name').value||'내 홍보')+'</b></div>'+(src?'<img class="feedimg" src="'+src+'">':'')+'<div style="padding:9px;font-size:13px">'+t.replace(/[<>]/g,'')+'</div><div class="react">♡ 좋아요　💬 댓글　🔔 알림　↗ 공유</div>';$('#feed').prepend(d)}async function sharePromo(){let t=$('#post').value||'멜라루카 개인 홍보페이지';if(navigator.share)await navigator.share({title:'멜라루카 사랑방',text:t,url:location.href});else navigator.clipboard?.writeText(t+' '+location.href)}function smsShare(){location.href='sms:?body='+encodeURIComponent(($('#post').value||'멜라루카 사랑방')+' '+location.href)}function copyPage(){navigator.clipboard?.writeText(location.href);alert('페이지 링크를 복사했습니다.')}$('#lang').onchange=()=>{localStorage.setItem('mela_lang',$('#lang').value);speak('언어 설정이 변경되었습니다.')};load();let l=localStorage.getItem('mela_lang');if(l)$('#lang').value=l;setTimeout(()=>speak('멜라루카 사랑방에 오신 것을 환영합니다. 제품 정보, 회사 정보, 회원가입과 보상 정보를 안내해 드립니다. 무엇을 도와드릴까요?'),700);</script></body></html>
